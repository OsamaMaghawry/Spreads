name: Deploy edge functions

# Each function is deployed as its own bundle containing a copy of whatever it
# imports from supabase/functions/_shared/, so editing a shared file leaves every
# other function running the old copy. Deploying with no function name deploys
# all of them, which keeps what is running consistent with the commit and makes
# a shared-code change cost one CI run instead of a manual redeploy of each.
#
# Requires one repository secret: SUPABASE_ACCESS_TOKEN
# (Supabase dashboard -> Account -> Access Tokens -> Generate new token,
#  then GitHub -> Settings -> Secrets and variables -> Actions -> New secret).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  # Lets a deploy be re-run from the Actions tab without an empty commit —
  # useful after rotating a function secret, which needs a redeploy to take hold.
  workflow_dispatch:

# Never let two deploys overlap, and never cancel one midway: a half-applied
# deploy would leave some functions on the new shared code and some on the old.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base and the staging comparison below need real history.
          fetch-depth: 0

      # Staging first, enforced rather than written down.
      #
      # AGENTS.md has said "staging first, every time" since the 30 Aug
      # incident, and it was still bypassed — once by a release that went
      # branch-to-main, and again when a function was deployed straight to the
      # production project over MCP. A paragraph cannot stop a deploy; this can.
      #
      # The test is on CONTENT, not on branch topology: the function tree being
      # deployed must be byte-identical to the one staging holds. That stays
      # correct whether main was fast-forwarded or took a merge commit, and it
      # fails exactly when it should — when production would run code that
      # staging never ran.
      - name: Refuse to deploy functions staging has not run
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin staging
          prod_tree=$(git rev-parse "HEAD:supabase/functions")
          staging_tree=$(git rev-parse "origin/staging:supabase/functions")
          if [ "$prod_tree" = "$staging_tree" ]; then
            echo "supabase/functions matches origin/staging ($prod_tree) — staging has run this code."
            exit 0
          fi
          echo "::error title=Staging first::supabase/functions on this commit ($prod_tree) differs from origin/staging ($staging_tree). Merge to staging, let it deploy, exercise it there, then merge to main."
          echo
          echo "Differences:"
          git diff --stat origin/staging HEAD -- supabase/functions
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The repo's own check, so a syntax error in a function is caught here
      # rather than by the bundler halfway through deploying twelve of them.
      - run: npm run lint

      # The generated product brief must match the code it describes; a stale
      # copy is worse than none, because it reads as current.
      - run: npm run context:check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Skips rather than fails when the token is absent, so the workflow can
      # live on main before the secret exists — and so forks, which never
      # receive secrets, do not report a red build for a deploy they were
      # never going to perform.
      - name: Deploy all functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Deploy skipped::SUPABASE_ACCESS_TOKEN is not set, so there is nothing to authenticate with. Add it under Settings → Secrets and variables → Actions and re-run."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Not a secret: this ref is already public in the project URL.
          SUPABASE_PROJECT_REF: yecfbeohyakuoyczvdbj
