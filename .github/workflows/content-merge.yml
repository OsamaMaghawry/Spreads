name: Merge content to staging for review

# The daily article pipeline ends on an agent branch: Routine sessions push
# to their own claude/* branch and are refused on main. This carries that
# branch as far as it can go without a person -- onto `staging`, where the
# post renders on the staging blog and the owner can read it as a reader
# would -- and no further. Production publication stays a decision.
#
# It used to merge into `main`, which publishes to the live blog, so the
# owner's review had no place to happen. It also refused any branch carrying
# a diagram, because the allowlist covered content/blog/ but not the SVGs the
# posts embed under landing/public/assets/blog/. Every post the content agent
# wrote between 3 and 7 Sep carried diagrams, so every one of them was
# refused, and the next day's session found no post and wrote it again. Five
# rewrites of one article, none of them anywhere a reader could see. Both
# faults are fixed here: staging is the destination, and the diagrams a post
# needs count as part of the post.
#
# IT HAPPENED AGAIN, 10 and 11 Sep, and the reason it went unnoticed for two
# days is the important half. The bid-ask-spread post was written, reviewed by
# the whole chain, and refused BOTH times because the same session had also
# committed `docs/growth/metrics/*.json` — files the allowlist did not name.
# The owner: *"The blog hasn't been updated or added any article for the past
# 2 days. This became really annoying that I keep chasing the agents' work."*
#
# He had no way to know. A refusal set `ok=false` and the job still exited 0,
# so GitHub showed a GREEN TICK on a run that had merged nothing. A silent
# skip on the one workflow whose entire job is to move work forward is worse
# than a crash: a crash gets looked at.
#
# So two changes, and the second matters more than the first:
#
#   1. The allowlist gains `docs/growth/`, which is generated reporting the
#      content session writes as a side effect. It is documentation, not code.
#
#   2. A REFUSAL NOW FAILS THE JOB. Red, with the offending paths named in the
#      run summary. Widening an allowlist only fixes the paths somebody thought
#      of; failing loudly fixes every path nobody thought of, which is the
#      class this bug keeps coming back as.

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'content/blog/**'
      - 'content/PLAN.md'
      - 'docs/seo/**'
      - 'landing/public/assets/blog/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: content-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Decide whether this push is content-only
        id: gate
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          head="origin/${GITHUB_REF_NAME}"
          base=$(git merge-base HEAD "$head")
          files=$(git diff --name-only "$base" "$head")
          echo "Changed since staging:"; echo "$files"
          bad=$(echo "$files" | grep -vE '^(content/blog/|content/PLAN\.md$|docs/seo/|docs/growth/|landing/public/assets/blog/)' || true)
          if [ -n "$bad" ]; then
            {
              echo "## Content NOT merged"
              echo
              echo "This branch carries files outside the content allowlist, so it was left"
              echo "for a person. **The post on it is not on staging and is not published.**"
              echo
              echo '```'
              echo "$bad"
              echo '```'
              echo
              echo "Either merge \`${GITHUB_REF_NAME}\` by hand, or add the paths above to the"
              echo "allowlist in .github/workflows/content-merge.yml if they belong there."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Content not merged::$(echo "$bad" | tr '\n' ' ')"
            # Fails ON PURPOSE. This used to exit 0, so a branch nobody merged
            # reported success and two days of posts went missing unnoticed.
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Merge into staging
        if: steps.gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "deltamint-content"
          git config user.email "content@deltamint.app"
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Draft for review: $(git log -1 --format=%s "origin/${GITHUB_REF_NAME}")"
          git push origin HEAD:staging

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # staging publish is dispatched explicitly -- workflow_dispatch is the one
      # event that token may raise.
      - name: Publish to the staging blog
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-blog-staging.yml --ref staging
