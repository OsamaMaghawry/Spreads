name: Merge and publish content

# The daily article pipeline ends on an agent branch: Routine sessions push to
# their own claude/* branch and are refused on main. This carries that branch
# the rest of the way -- onto the trunk, and onto the blog.
#
# THIS GATE HAS NOW LOST POSTS FOUR TIMES, and the shape of the bug is worth
# stating because the first three fixes all attacked the wrong half of it.
#
#   3-7 Sep. The allowlist covered content/blog/ but not the SVGs the posts
#   embed, so every post carrying a diagram was refused -- which was all of
#   them. Five rewrites of one article. Fixed by widening the allowlist.
#
#   10-11 Sep. Refused twice more because the session had also committed
#   docs/growth/metrics/*.json. The owner: *"The blog hasn't been updated or
#   added any article for the past 2 days. This became really annoying that I
#   keep chasing the agents' work."* Worse, a refusal exited 0, so GitHub
#   showed a GREEN TICK on a run that merged nothing. Fixed by widening the
#   allowlist again, and by failing loudly.
#
#   16-20 Sep. Thirteen consecutive red runs and six days with nothing on the
#   blog. *"As always, the blog is not posting anything for days. And you keep
#   saying it's fixed!!!!"*
#
# The fourth time was not the allowlist. THE DIFF BASE WAS WRONG: the gate
# measured each branch against `staging` while the branches are cut from
# `main`, so it attributed all 73 commits of trunk divergence to a post that
# touched six files. Widening an allowlist can never fix that, which is why
# the same bug kept returning wearing different paths. See the gate step.
#
# The second half of 16-20 Sep was the destination. Content merged to staging,
# publish-blog only runs on main, and agents branch from main -- so posts that
# did land were invisible both to readers and to the next day's writer, which
# is why one article was drafted four times in five days. Both are fixed
# below: the base is the branch's own fork point, and the destination is the
# trunk the writers actually read.

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'content/blog/**'
      - 'content/PLAN.md'
      - 'docs/seo/**'
      - 'landing/public/assets/blog/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: content-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: staging

      - name: Decide whether this push is content-only
        id: gate
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}" main staging
          head="origin/${GITHUB_REF_NAME}"

          # THE BRANCH'S OWN FORK POINT, not its distance from staging.
          #
          # This is the third time this gate has refused a clean post, and the
          # first two fixes both widened the allowlist -- which was treating the
          # symptom. The base was wrong.
          #
          # `merge-base(staging, branch)` asks "where did this branch and
          # staging last agree". Content branches are cut from MAIN, and main
          # and staging diverged at c835e0f with 13 commits on one side and 73
          # on the other. So that merge-base is weeks old and the diff from it
          # carries every file that differs between the two trunks -- 37 files
          # for a branch that changed 6 -- and the gate blamed the post for all
          # of them. Every run from 16 to 20 September failed this way, thirteen
          # in a row, while the same gamma article was written from scratch four
          # times because each session branched from main and could not see the
          # copy sitting on staging.
          #
          # The right question is what THIS BRANCH added, so the base is the
          # nearest point it forks from either trunk. `--is-ancestor` picks the
          # more recent of the two candidates, which is the trunk it was
          # actually cut from, whichever that turns out to be.
          bm=$(git merge-base "$head" origin/main)
          bs=$(git merge-base "$head" origin/staging)
          if git merge-base --is-ancestor "$bs" "$bm"; then base="$bm"; else base="$bs"; fi
          echo "Branch forks from $(git log --oneline -1 "$base")"

          files=$(git diff --name-only "$base" "$head")
          echo "Changed by this branch:"; echo "$files"
          bad=$(echo "$files" | grep -vE '^(content/blog/|content/PLAN\.md$|docs/seo/|docs/growth/|landing/public/assets/blog/)' || true)
          if [ -n "$bad" ]; then
            {
              echo "## Content NOT merged"
              echo
              echo "This branch carries files outside the content allowlist, so it was left"
              echo "for a person. **The post on it is not merged and is not published.**"
              echo
              echo '```'
              echo "$bad"
              echo '```'
              echo
              echo "Either merge \`${GITHUB_REF_NAME}\` by hand, or add the paths above to the"
              echo "allowlist in .github/workflows/content-merge.yml if they belong there."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Content not merged::$(echo "$bad" | tr '\n' ' ')"
            # Fails ON PURPOSE. This used to exit 0, so a branch nobody merged
            # reported success and two days of posts went missing unnoticed.
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # ONE TRUNK, AND IT IS THE ONE THE AGENTS BRANCH FROM.
      #
      # Routing content to `staging` was meant to give the owner a review step.
      # In thirteen days it produced no reviews and two failures instead:
      #
      #   Production starved. A post that reached staging stopped there. The
      #   live blog's last article is dated 14 September because nothing
      #   carried one to main, and only a push to main runs publish-blog.
      #
      #   The article was written four times. Sessions branch from MAIN, so a
      #   post merged to staging is invisible to the next day's agent. It finds
      #   no gamma article, writes it again, and the cycle repeats -- 16, 18,
      #   19 and 20 September, four drafts of one post, none of them readable
      #   by anybody.
      #
      # Both follow from content living on a branch the writers cannot see. The
      # destination is now the trunk they are cut from, which closes the loop:
      # merged here, the post is on main, publish-blog puts it on the live blog,
      # and tomorrow's session sees it already written.
      #
      # Review has not been dropped, it has moved earlier. desk-editor,
      # seo-editor and compliance-gate each pass every post BEFORE it is
      # committed, and no post merges without all three. To put a human back in
      # front of publication, set TRUNK to `staging` -- but then somebody must
      # merge staging to main, or the blog stops again exactly as it did here.
      - name: Merge into the trunk
        if: steps.gate.outputs.ok == 'true'
        env:
          TRUNK: main
        run: |
          set -euo pipefail
          git config user.name "deltamint-content"
          git config user.email "content@deltamint.app"
          git checkout -B "$TRUNK" "origin/$TRUNK"
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Publish: $(git log -1 --format=%s "origin/${GITHUB_REF_NAME}")"
          git push origin "HEAD:$TRUNK"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # publish is dispatched explicitly -- workflow_dispatch is the one event
      # that token may raise. Without this the merge lands and nothing renders
      # it, which is its own silent-failure mode.
      - name: Publish to the blog
        if: steps.gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRUNK: main
        run: |
          if [ "$TRUNK" = "main" ]; then
            gh workflow run publish-blog.yml --ref main
          else
            gh workflow run publish-blog-staging.yml --ref staging
          fi
