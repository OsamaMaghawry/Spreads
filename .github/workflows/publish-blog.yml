name: Publish blog posts

# Closes the gap between "a post is written" and "a reader can see it".
#
# content-engine writes to content/blog/ and commits. Until now that was the
# end of the line: the only route into the blog_posts table was a human in the
# admin panel, so two finished posts sat in the repo while production served an
# empty blog and five weekly agents reported around it. Publishing is now a
# consequence of merging.
#
# Idempotent (upsert on slug), so a re-run republishes rather than duplicating,
# and an edit to a merged post updates the live copy.

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
      - 'scripts/publish-blog.mjs'
      - '.github/workflows/publish-blog.yml'
  workflow_dispatch:

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Refuse rather than run with an empty key: PostgREST answers an
      # unauthenticated write with a 401 that reads like a schema problem, and
      # the failure would be attributed to the post rather than the secret.
      - name: Require credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set; cannot publish." >&2
            exit 1
          fi

      - name: Publish
        id: publish
        env:
          SUPABASE_URL: https://yecfbeohyakuoyczvdbj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Not a secret -- it is shipped to every browser. Passed so the script
          # can re-read the posts as the public sees them and fail if a row was
          # written but is not actually visible.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/publish-blog.mjs

      # TELL SOMEBODY. The owner, on finding a finished article had sat
      # unpublished for a day behind a red run nobody was watching: *"THIS IS
      # NOT ACCEPTABLE ANYMORE. My job is not chasing this."*
      #
      # A failed publish is invisible unless someone opens the Actions tab. The
      # blog is the one part of this product with no user to notice it is
      # broken -- a trader sees a wrong number, but nobody complains about an
      # article that never appeared. So the job now says so out loud, through
      # the same Brevo account the product's own mail goes through.
      #
      # `if: failure()` only, and never blocking: a notification that fails
      # must not turn a successful publish red, which is why the send is
      # `|| true` and the step carries no credentials beyond the SMTP pair
      # already used by the digest workflow.
      - name: Say so when publishing fails
        if: failure()
        env:
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${BREVO_SMTP_USER:-}" ] || [ -z "${BREVO_SMTP_PASS:-}" ]; then
            echo "Brevo SMTP credentials not set; cannot send the failure notice." >&2
            exit 0
          fi
          python3 - <<'PY' || true
          import os, smtplib
          from email.message import EmailMessage
          m = EmailMessage()
          m["Subject"] = "DeltaMint: the blog did not publish"
          m["From"] = "DeltaMint <support@deltamint.app>"
          m["To"] = "support@deltamint.app"
          m.set_content(
              "The publish-blog job failed, so anything written since the last "
              "successful run is still not on the blog.\n\n"
              f"The run, with the reason: {os.environ['RUN_URL']}\n\n"
              "Nothing is lost — the articles are in the repository. Re-running "
              "the job republishes them once the cause is fixed.\n"
          )
          with smtplib.SMTP("smtp-relay.brevo.com", 587, timeout=20) as s:
              s.starttls()
              s.login(os.environ["BREVO_SMTP_USER"], os.environ["BREVO_SMTP_PASS"])
              s.send_message(m)
          print("failure notice sent")
          PY
