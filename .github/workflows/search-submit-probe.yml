name: Live site probe (temporary)

# One-off check, 21 Oct 2026: are the blog diagrams merged since 12 Oct and
# the IndexNow key file actually served by deltamint.app? Read-only.
on:
  push:
    branches: [claude/search-submit-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch a few assets from the live site
        run: |
          for p in assets/blog/collar-payoff.svg assets/blog/tail-hedge-three-paths.svg assets/blog/protective-put-payoff.svg assets/blog/wheel-running-cost-basis.svg 8b62b8a4ab3d56d58e2397ca07208234.txt blog/collar-option-strategy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://deltamint.app/$p")
            echo "::notice title=live::$code /$p"
          done
