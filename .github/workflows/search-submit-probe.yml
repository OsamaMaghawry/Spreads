name: Live site probe (temporary)

# One-off checks from outside, read-only. 22 Oct: the staging /expected-move pages.
on:
  push:
    branches: [claude/search-submit-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the staging expected-move pages
        shell: bash
        run: |
          set +e
          base=https://dev-landing.deltamint.app
          for p in expected-move expected-move/tsla expected-move/spy expected-move/TSLA expected-move/nope sitemap.xml; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$base/$p")
            title=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | sed 's/<title>//')
            meta=$(grep -o '<p class="meta"[^<]*' /tmp/p.html | head -1 | sed 's/<p class="meta"[^>]*>//')
            lede=$(grep -o '<p class="lede">.*</p>' /tmp/p.html | head -1 | sed 's/<[^>]*>//g' | cut -c1-200)
            urls=$(grep -c '<loc>' /tmp/p.html)
            echo "::notice title=live::$code /$p | $title | $meta | $lede | locs=$urls"
          done
