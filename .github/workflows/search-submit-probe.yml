name: Live site probe (temporary)

# One-off check, 21 Oct 2026: are the blog diagrams merged since 12 Oct and
# the IndexNow key file actually served by deltamint.app? Read-only.
on:
  push:
    branches: [claude/search-submit-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Is the key file real, and does a missing page return 404
        run: |
          body=$(curl -s https://deltamint.app/8b62b8a4ab3d56d58e2397ca07208234.txt | head -c 80 | tr -d '\n')
          echo "::notice title=live::key body [$body]"
          code=$(curl -s -o /dev/null -w '%{http_code}' https://deltamint.app/assets/blog/does-not-exist-zz.svg)
          echo "::notice title=live::missing file -> $code"
          srv=$(curl -sI https://deltamint.app/8b62b8a4ab3d56d58e2397ca07208234.txt | grep -i "^cf-ray\|^server\|^last-modified\|^etag" | tr -d '\r' | tr '\n' ' ')
          echo "::notice title=live::headers $srv"
