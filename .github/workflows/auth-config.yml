name: Apply Supabase auth config

# The two settings that decide what a person receives when they sign up, kept
# here rather than in a dashboard.
#
# Both bit us in production. The Site URL still pointed at the Worker's
# workers.dev subdomain, so confirmation links sent people to an origin where
# they were not signed in and could not connect a broker — and exposed the
# deployment URL in every email. And the confirmation template was Supabase's
# stock one, which carries a link and no {{ .Token }}, while the app's
# registration screen asks for a six-digit code. Neither is visible in the
# repository, neither is covered by a test, and both silently drift.
#
# Uses the same SUPABASE_ACCESS_TOKEN the function deploy already needs.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/auth/**'
      - '.github/workflows/auth-config.yml'
  workflow_dispatch:

concurrency:
  group: supabase-auth-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: yecfbeohyakuoyczvdbj
      APP_URL: https://dashboard.deltamint.app
    steps:
      - uses: actions/checkout@v4

      - name: Apply auth configuration
        run: |
          set -euo pipefail

          body=$(jq -n \
            --arg site "$APP_URL" \
            --arg allow "$APP_URL/**,$APP_URL" \
            --arg subject "Confirm your DeltaMint account" \
            --rawfile confirm supabase/auth/confirm-signup.html \
            '{
               site_url: $site,
               uri_allow_list: $allow,
               mailer_subjects_confirmation: $subject,
               mailer_templates_confirmation_content: $confirm
             }')

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$body")

          if [ "$code" != "200" ]; then
            echo "Auth config update failed with HTTP $code:"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Auth config applied."

      - name: Verify what the project now reports
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
          | jq '{site_url, uri_allow_list, mailer_subjects_confirmation,
                 confirmation_template_has_token:
                   (.mailer_templates_confirmation_content // "" | test("\\{\\{ \\.Token \\}\\}"))}'
