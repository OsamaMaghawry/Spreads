name: Apply Supabase auth config

# The two settings that decide what a person receives when they sign up, kept
# here rather than in a dashboard.
#
# Both bit us in production. The Site URL still pointed at the Worker's
# workers.dev subdomain, so confirmation links sent people to an origin where
# they were not signed in and could not connect a broker — and exposed the
# deployment URL in every email. And the confirmation template was Supabase's
# stock one, which carries a link and no {{ .Token }}, while the app's
# registration screen asks for a six-digit code. Neither is visible in the
# repository, neither is covered by a test, and both silently drift.
#
# Uses the same SUPABASE_ACCESS_TOKEN the function deploy already needs.

# Manual only, and deliberately so.
#
# The SUPABASE_ACCESS_TOKEN the function deploy uses came back 403 from the
# auth endpoint: it does not carry the account privileges the Management API
# wants for this. Left on push, this failed on every change to these files and
# mailed a failure notice each time, which is noise about a step that cannot
# succeed yet.
#
# Add a Supabase personal access token with account privileges as
# SUPABASE_MANAGEMENT_TOKEN, switch the secret below, and this becomes a real
# deploy step again. Until then the two settings are applied by hand, and the
# files here are what to paste.
on:
  workflow_dispatch:

concurrency:
  group: supabase-auth-config
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: yecfbeohyakuoyczvdbj
      APP_URL: https://dashboard.deltamint.app
      # Sign-up and password-reset mail goes through Brevo as the brand, not
      # through Supabase's shared sender. Supabase's built-in mailer is also
      # rate-limited to a handful of messages an hour, which is a real ceiling
      # on registrations, not just a cosmetic one.
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      SMTP_SENDER_EMAIL: support@deltamint.app
      SMTP_SENDER_NAME: DeltaMint
    steps:
      - uses: actions/checkout@v4

      # Refuse rather than send empty credentials. A PATCH with a blank
      # smtp_pass is accepted and silently breaks every confirmation email —
      # nobody can register, and nothing says why.
      - name: Require SMTP credentials
        env:
          SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER:-}" ] || [ -z "${SMTP_PASS:-}" ]; then
            echo "BREVO_SMTP_USER and BREVO_SMTP_PASS must both be set as repository secrets."
            echo "These are Brevo's SMTP credentials (SMTP & API -> SMTP tab):"
            echo "  user = the SMTP login, like 9xxxxxx@smtp-brevo.com"
            echo "  pass = an SMTP key generated on that tab"
            echo "NOT the xkeysib- REST API key, which is a different credential."
            exit 1
          fi

      - name: Apply auth configuration
        env:
          SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          SMTP_PASS: ${{ secrets.BREVO_SMTP_PASS }}
        run: |
          set -euo pipefail

          body=$(jq -n \
            --arg site "$APP_URL" \
            --arg allow "$APP_URL/**,$APP_URL" \
            --arg subject "Confirm your DeltaMint account" \
            --rawfile confirm supabase/auth/confirm-signup.html \
            --arg smtp_host "$SMTP_HOST" \
            --argjson smtp_port "$SMTP_PORT" \
            --arg smtp_user "$SMTP_USER" \
            --arg smtp_pass "$SMTP_PASS" \
            --arg smtp_email "$SMTP_SENDER_EMAIL" \
            --arg smtp_name "$SMTP_SENDER_NAME" \
            '{
               site_url: $site,
               uri_allow_list: $allow,
               mailer_subjects_confirmation: $subject,
               mailer_templates_confirmation_content: $confirm,
               smtp_host: $smtp_host,
               smtp_port: $smtp_port,
               smtp_user: $smtp_user,
               smtp_pass: $smtp_pass,
               smtp_admin_email: $smtp_email,
               smtp_sender_name: $smtp_name
             }')

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$body")

          if [ "$code" != "200" ]; then
            echo "Auth config update failed with HTTP $code:"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Auth config applied."

      - name: Verify what the project now reports
        run: |
          set -euo pipefail
          curl -sS "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
          | jq '{site_url, uri_allow_list, mailer_subjects_confirmation,
                 smtp_host, smtp_port, smtp_admin_email, smtp_sender_name,
                 smtp_pass_set: (.smtp_pass // "" | length > 0),
                 confirmation_template_has_token:
                   (.mailer_templates_confirmation_content // "" | test("\\{\\{ \\.Token \\}\\}"))}'
