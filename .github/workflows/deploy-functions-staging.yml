name: Deploy edge functions (staging)

# Mirrors deploy-functions.yml but targets the staging branch and the
# separate "Spread Staging" Supabase project, so staging changes never touch
# production data or production edge functions.
#
# Requires its own SUPABASE_STAGING_ACCESS_TOKEN secret — a personal access
# token scoped to the "Spread Staging" project only, deliberately separate
# from deploy-functions.yml's SUPABASE_ACCESS_TOKEN (scoped to production
# only). Neither token can reach the other project; do not consolidate them
# into one account-wide token.

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-edge-functions-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run context:check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions to staging
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Deploy skipped::SUPABASE_STAGING_ACCESS_TOKEN is not set."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          # Not a secret: this ref is already public in the staging project URL.
          SUPABASE_PROJECT_REF: wpwaomzgpbozzghohwmf
