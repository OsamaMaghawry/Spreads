name: Deploy Cloudflare Workers

# Cloudflare's own Git integration only runs `wrangler versions upload`, which
# creates an unpromoted preview version — it never reaches production traffic.
# This workflow runs the actual `wrangler deploy` so a push to main goes live.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN
# (Cloudflare dashboard -> My Profile -> API Tokens -> Create Token -> Edit
#  Cloudflare Workers template, then GitHub -> Settings -> Secrets and
#  variables -> Actions -> New secret).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.jsonc'
      - 'landing/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy dashboard worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so there is nothing to authenticate with. Add it under Settings → Secrets and variables → Actions and re-run."
            exit 0
          fi
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy landing worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so there is nothing to authenticate with. Add it under Settings → Secrets and variables → Actions and re-run."
            exit 0
          fi
          npx wrangler deploy
        working-directory: landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
