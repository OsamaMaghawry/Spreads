<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Filled in by scripts/og-card.mjs: the brand fonts from scripts/fonts,
     the colours from landing/public/assets/site.css. */
  {{FONTS}}
  :root { {{TOKENS}} }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--paper);
    font-family: "IBM Plex Sans", sans-serif;
    color: var(--ink);
    padding: 72px 88px 64px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  /* The lockup, with the site's own geometry (site.css .brandmark). */
  .brandmark { display: flex; align-items: baseline; gap: 0.3em; font-size: 46px; color: var(--ink); }
  .brandmark svg { height: 0.9024em; width: auto; display: block; position: relative; top: 0.0876em; }
  .brandmark span { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .brandmark .m { color: var(--mint); }

  h1 {
    margin-top: 64px;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 76px; line-height: 1.02; letter-spacing: -0.03em;
    max-width: 980px; text-wrap: balance;
  }
  p.desc {
    margin-top: 26px; max-width: 940px;
    font-size: 29px; line-height: 1.4; color: var(--ink-soft);
  }
  .foot {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between;
    border-top: 2px solid var(--line); padding-top: 22px;
  }
  .url { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; color: var(--mint); }
  .rail { display: flex; gap: 10px; }
  .rail i { width: 44px; height: 10px; border-radius: 5px; background: var(--brand); display: block; }
  .rail i:nth-child(2) { background: var(--mint); }
  .rail i:nth-child(3) { background: var(--line); }
</style>
</head>
<body>
  <div class="brandmark">{{LOCKUP}}</div>
  <h1>{{TITLE}}</h1>
  <p class="desc">{{DESCRIPTION}}</p>
  <div class="foot">
    <span class="url">deltamint.app</span>
    <span class="rail" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
</body>
</html>
