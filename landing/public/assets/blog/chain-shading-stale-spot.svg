<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A line of call strikes at 48, 50 and 52 for a hypothetical stock, XYZ. A platform on a delayed feed shows XYZ at 49.90, marked by a dashed line, and shades every call struck below that price as in the money, so only the 48 strike falls inside the shaded band. The stock actually trades at 50.30, marked by a solid line to the right of the 50 strike, which means the unshaded 50 call is in fact in the money.">
  <rect width="720" height="280" fill="#FFFFFF"/>

  <!-- shaded band: strikes below the platform's price -->
  <rect x="60" y="110" width="288" height="100" fill="#F1F2F6"/>
  <text x="204" y="142" font-size="15" text-anchor="middle" fill="#767B8E">shaded in the money</text>

  <!-- strike axis -->
  <line x1="60" y1="170" x2="660" y2="170" stroke="#C9CEDC" stroke-width="1.5"/>
  <circle cx="120" cy="170" r="7" fill="#14151C"/>
  <circle cx="360" cy="170" r="7" fill="#B4485C"/>
  <circle cx="600" cy="170" r="7" fill="#14151C"/>
  <text x="120" y="244" font-size="20" font-weight="600" text-anchor="middle" fill="#14151C">48</text>
  <text x="360" y="244" font-size="20" font-weight="600" text-anchor="middle" fill="#B4485C">50</text>
  <text x="600" y="244" font-size="20" font-weight="600" text-anchor="middle" fill="#14151C">52</text>

  <!-- the price the platform last received -->
  <line x1="348" y1="90" x2="348" y2="220" stroke="#767B8E" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="340" y="80" font-size="16" text-anchor="end" fill="#767B8E">platform price 49.90</text>

  <!-- where the stock actually trades -->
  <line x1="396" y1="90" x2="396" y2="220" stroke="#14151C" stroke-width="2.5"/>
  <text x="404" y="80" font-size="16" font-weight="600" fill="#14151C">stock now 50.30</text>
</svg>
