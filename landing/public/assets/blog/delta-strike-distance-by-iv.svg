<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Where the 0.20 delta put strike sits on one hypothetical stock at $50 with 30 days left, at three implied volatilities. At 25% it is 47.19, $2.81 below the stock. At 40% it is 45.70, $4.30 below. At 60% it is 43.91, $6.09 below. The same delta is a different dollar distance each time.">
  <rect width="720" height="270" fill="#FFFFFF"/>
  <text x="60" y="32" font-size="14" font-weight="600" fill="#14151C">25%</text>
  <line x1="60" y1="54" x2="660" y2="54" stroke="#D5D8E2" stroke-width="2"/>
  <rect x="491.4" y="46" width="168.6" height="16" fill="#B4485C" fill-opacity="0.35"/>
  <circle cx="660" cy="54" r="6" fill="#14151C"/>
  <circle cx="491.4" cy="54" r="7" fill="#B4485C"/>
  <text x="479.4" y="59" font-size="14" font-weight="600" text-anchor="end" fill="#14151C">47.19</text>
  <text x="575.7" y="80" font-size="13" text-anchor="middle" fill="#B4485C">$2.81</text>
  <text x="60" y="94" font-size="14" font-weight="600" fill="#14151C">40%</text>
  <line x1="60" y1="116" x2="660" y2="116" stroke="#D5D8E2" stroke-width="2"/>
  <rect x="402.0" y="108" width="258.0" height="16" fill="#B4485C" fill-opacity="0.35"/>
  <circle cx="660" cy="116" r="6" fill="#14151C"/>
  <circle cx="402.0" cy="116" r="7" fill="#B4485C"/>
  <text x="390.0" y="121" font-size="14" font-weight="600" text-anchor="end" fill="#14151C">45.70</text>
  <text x="531.0" y="142" font-size="13" text-anchor="middle" fill="#B4485C">$4.30</text>
  <text x="60" y="156" font-size="14" font-weight="600" fill="#14151C">60%</text>
  <line x1="60" y1="178" x2="660" y2="178" stroke="#D5D8E2" stroke-width="2"/>
  <rect x="294.6" y="170" width="365.4" height="16" fill="#B4485C" fill-opacity="0.35"/>
  <circle cx="660" cy="178" r="6" fill="#14151C"/>
  <circle cx="294.6" cy="178" r="7" fill="#B4485C"/>
  <text x="282.6" y="183" font-size="14" font-weight="600" text-anchor="end" fill="#14151C">43.91</text>
  <text x="477.3" y="204" font-size="13" text-anchor="middle" fill="#B4485C">$6.09</text>
  <text x="660" y="30" font-size="13" text-anchor="middle" fill="#767B8E">stock $50</text>
</svg>
