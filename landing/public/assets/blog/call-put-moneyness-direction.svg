<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A hypothetical 50 strike on a price line: the call's in-the-money region sits above the strike and the put's sits below it, so at 52 the call is in the money by 2 while the put is out of the money, and at 48 the two swap places.">
  <rect width="720" height="260" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="13.5" font-weight="600" fill="#14151C">"In the money" points opposite ways from the same strike</text>

  <!-- axis -->
  <line x1="40" y1="150" x2="680" y2="150" stroke="#C9CEDC" stroke-width="1.5"/>
  <line x1="360" y1="132" x2="360" y2="168" stroke="#14151C" stroke-width="1.5"/>
  <text x="360" y="188" font-size="11.5" fill="#14151C" text-anchor="middle" font-weight="500">50 — the strike</text>

  <!-- call zone arrow, above line, pointing right -->
  <line x1="368" y1="102" x2="656" y2="102" stroke="#4B4F60" stroke-width="1.5"/>
  <path d="M656 98 L664 102 L656 106 Z" fill="#4B4F60"/>
  <text x="368" y="88" font-size="12" font-weight="600" fill="#14151C">Call in the money here — underlying above 50</text>

  <!-- put zone arrow, below line, pointing left -->
  <line x1="352" y1="218" x2="64" y2="218" stroke="#4B4F60" stroke-width="1.5"/>
  <path d="M64 214 L56 218 L64 222 Z" fill="#4B4F60"/>
  <text x="352" y="240" font-size="12" font-weight="600" fill="#14151C" text-anchor="end">Put in the money here — underlying below 50</text>

  <!-- marker at 52: call ITM, put OTM -->
  <circle cx="460" cy="150" r="4" fill="#14151C"/>
  <line x1="460" y1="150" x2="460" y2="134" stroke="#A7AEC2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="460" y="128" font-size="11" fill="#14151C" text-anchor="middle" font-weight="500">XYZ at 52</text>
  <text x="460" y="66" font-size="10.5" fill="#767B8E" text-anchor="middle">call ITM by 2, put OTM</text>

  <!-- marker at 48: call OTM, put ITM -->
  <circle cx="260" cy="150" r="4" fill="#14151C"/>
  <line x1="260" y1="150" x2="260" y2="134" stroke="#A7AEC2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="260" y="128" font-size="11" fill="#14151C" text-anchor="middle" font-weight="500">XYZ at 48</text>
  <text x="260" y="66" font-size="10.5" fill="#767B8E" text-anchor="middle">call OTM, put ITM by 2</text>

  <text x="24" y="250" font-size="10.5" fill="#767B8E">Hypothetical strike and prices, shown for the definition only.</text>
</svg>
