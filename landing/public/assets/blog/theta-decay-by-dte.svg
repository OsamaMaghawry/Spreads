<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Four horizontal bars showing the estimated one-day decay in dollars of the same hypothetical at-the-money call at four points before expiration, each bar drawn against a light track. At 60 days left the one-day decay is about 3 dollars, a small part of the track. At 30 days left it is about 4 dollars. At 14 days left it is about 6 dollars. At 7 days left it is about 8 dollars, filling most of the track. Each bar is longer than the last as days to expiration falls.">
  <rect width="720" height="320" fill="#FFFFFF"/>

  <text x="128" y="60" font-size="15" text-anchor="end" fill="#767B8E">days left</text>
  <text x="640" y="60" font-size="15" fill="#767B8E">1-day decay</text>

  <!-- 60 days: -$3/day -->
  <text x="128" y="106" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">60</text>
  <rect x="144" y="86" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="86" width="168" height="28" rx="4" fill="#B4485C"/>
  <text x="640" y="106" font-size="18" font-weight="600" fill="#14151C">$3</text>

  <!-- 30 days: -$4/day -->
  <text x="128" y="166" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">30</text>
  <rect x="144" y="146" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="146" width="224" height="28" rx="4" fill="#B4485C"/>
  <text x="640" y="166" font-size="18" font-weight="600" fill="#14151C">$4</text>

  <!-- 14 days: -$6/day -->
  <text x="128" y="226" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">14</text>
  <rect x="144" y="206" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="206" width="336" height="28" rx="4" fill="#B4485C"/>
  <text x="640" y="226" font-size="18" font-weight="600" fill="#14151C">$6</text>

  <!-- 7 days: -$8/day -->
  <text x="128" y="286" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">7</text>
  <rect x="144" y="266" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="266" width="448" height="28" rx="4" fill="#B4485C"/>
  <text x="640" y="286" font-size="18" font-weight="600" fill="#14151C">$8</text>
</svg>
