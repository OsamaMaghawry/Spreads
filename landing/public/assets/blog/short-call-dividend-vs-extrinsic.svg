<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Two pairs of horizontal bars on one dollar scale, for a hypothetical deep in the money short call with a 0.50 dividend going ex the next day. With 10 days left the call carries only 0.05 of extrinsic value, far shorter than the 0.50 dividend, so a holder has a reason to exercise the evening before. With 90 days left it carries 0.80, longer than the dividend, so the dividend alone is no reason to exercise.">
  <rect width="720" height="300" fill="#FFFFFF"/>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#14151C">10 days left: the dividend is the larger figure</text>
  <text x="220" y="68" font-size="15" text-anchor="end" fill="#767B8E">extrinsic left</text>
  <rect x="236" y="48" width="440" height="28" fill="#F1F2F6"/>
  <rect x="236" y="48" width="22" height="28" fill="#767B8E"/>
  <text x="268" y="68" font-size="16" font-weight="600" fill="#14151C">0.05</text>
  <text x="220" y="106" font-size="15" text-anchor="end" fill="#767B8E">the dividend</text>
  <rect x="236" y="86" width="440" height="28" fill="#F1F2F6"/>
  <rect x="236" y="86" width="220" height="28" fill="#B4485C"/>
  <text x="466" y="106" font-size="16" font-weight="600" fill="#14151C">0.50</text>

  <text x="24" y="168" font-size="16" font-weight="600" fill="#14151C">90 days left: the extrinsic value is the larger figure</text>
  <text x="220" y="206" font-size="15" text-anchor="end" fill="#767B8E">extrinsic left</text>
  <rect x="236" y="186" width="440" height="28" fill="#F1F2F6"/>
  <rect x="236" y="186" width="352" height="28" fill="#767B8E"/>
  <text x="598" y="206" font-size="16" font-weight="600" fill="#14151C">0.80</text>
  <text x="220" y="244" font-size="15" text-anchor="end" fill="#767B8E">the dividend</text>
  <rect x="236" y="224" width="440" height="28" fill="#F1F2F6"/>
  <rect x="236" y="224" width="220" height="28" fill="#B4485C"/>
  <text x="466" y="244" font-size="16" font-weight="600" fill="#14151C">0.50</text>

  <text x="24" y="284" font-size="11" fill="#767B8E">Hypothetical figures, per share, for the arithmetic only.</text>
</svg>
