<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Gain or loss at expiration, per share against the $48 cost, of a hypothetical covered call: 100 shares of XYZ bought at 48 with one 52-strike call sold against them for 1.42, drawn against the shares held alone. The dashed line for the shares alone rises one for one with the stock price. The covered call line sits 1.42 above it for every price below the 52 strike, a green band showing the premium's cushion, and crosses zero at a break-even of 46.58 instead of 48. Above the strike the covered call line goes flat at 5.42 per share, which is the 4.00 from 48 to 52 plus the 1.42 premium, and a red wedge shows the rise in the shares above 53.42 that the position gives up.">
  <rect width="720" height="340" fill="#FFFFFF"/>

  <!-- zero line and strike guide -->
  <line x1="80" y1="183" x2="660" y2="183" stroke="#C9CEDC" stroke-width="1.5"/>
  <line x1="428" y1="40" x2="428" y2="290" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="428" y="312" font-size="18" font-weight="600" text-anchor="middle" fill="#14151C">52</text>

  <!-- premium cushion: covered call sits 1.42 above the shares below the strike -->
  <polygon points="80,271 428,139 428,123.4 80,255.4" fill="#2E8B5F" fill-opacity="0.18"/>
  <text x="200" y="258" font-size="15" font-weight="600" fill="#2E8B5F">premium</text>

  <!-- upside given up above the cap -->
  <polygon points="469.2,123.4 660,123.4 660,51" fill="#B4485C" fill-opacity="0.16"/>
  <text x="600" y="112" font-size="15" font-weight="600" text-anchor="middle" fill="#B4485C">given up</text>

  <!-- shares alone -->
  <path d="M80 271 L660 51" fill="none" stroke="#767B8E" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="560" y="62" font-size="15" text-anchor="end" fill="#767B8E">shares alone</text>

  <!-- covered call -->
  <path d="M80 255.4 L428 123.4 L660 123.4" fill="none" stroke="#14151C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="660" y="148" font-size="17" font-weight="600" text-anchor="end" fill="#14151C">covered call</text>

  <!-- break-even -->
  <circle cx="270.8" cy="183" r="6" fill="#FFFFFF" stroke="#14151C" stroke-width="2"/>
  <text x="258" y="170" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">break-even 46.58</text>

  <!-- axis label -->
  <text x="370" y="332" font-size="15" text-anchor="middle" fill="#767B8E">stock price at expiration</text>
</svg>
