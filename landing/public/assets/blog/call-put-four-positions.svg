<svg viewBox="0 0 720 404" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A two-by-two grid of the four option positions: a bought call and a bought put are rights that cost a premium and leave the decision with you, while a sold call and a sold put are obligations that receive a premium and are decided by whoever holds the other side.">
  <rect width="720" height="404" fill="#FFFFFF"/>

  <text x="24" y="26" font-size="13.5" font-weight="600" fill="#14151C">Two contract types, two signs, four positions</text>
  <text x="24" y="46" font-size="11.5" fill="#767B8E">Hypothetical XYZ 50-strike contracts, each quoted $2.00 — $200 per contract at the 100 multiplier</text>

  <text x="234" y="70" font-size="12" font-weight="600" fill="#14151C" text-anchor="middle">Bought it</text>
  <text x="550" y="70" font-size="12" font-weight="600" fill="#14151C" text-anchor="middle">Sold it</text>

  <!-- row label: call -->
  <text x="16" y="148" font-size="13" font-weight="600" fill="#14151C">Call</text>
  <text x="16" y="164" font-size="10" fill="#767B8E">shares to</text>
  <text x="16" y="176" font-size="10" fill="#767B8E">the holder</text>

  <!-- row label: put -->
  <text x="16" y="300" font-size="13" font-weight="600" fill="#14151C">Put</text>
  <text x="16" y="316" font-size="10" fill="#767B8E">shares from</text>
  <text x="16" y="328" font-size="10" fill="#767B8E">the holder</text>

  <!-- long call -->
  <rect x="84" y="82" width="300" height="140" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <rect x="100" y="96" width="122" height="22" rx="5" fill="#FFFFFF" stroke="#E2E5EE"/>
  <text x="161" y="111" font-size="11.5" font-weight="600" fill="#14151C" text-anchor="middle">+1 · a right</text>
  <text x="100" y="140" font-size="11" fill="#767B8E">Cash at the fill</text>
  <rect x="200" y="126" width="70" height="19" rx="4" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="235" y="140" font-size="11.5" font-weight="500" fill="#B4485C" text-anchor="middle">&#8722;$200</text>
  <text x="100" y="166" font-size="11.5" fill="#14151C">Exercise it and you buy 100 shares at 50,</text>
  <text x="100" y="182" font-size="11.5" fill="#14151C">paying $5,000 for them.</text>
  <text x="100" y="206" font-size="11.5" font-weight="500" fill="#14151C">Unless it expires worthless, you decide.</text>

  <!-- short call -->
  <rect x="400" y="82" width="300" height="140" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <rect x="416" y="96" width="152" height="22" rx="5" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="492" y="111" font-size="11.5" font-weight="600" fill="#B4485C" text-anchor="middle">&#8722;1 · an obligation</text>
  <text x="416" y="140" font-size="11" fill="#767B8E">Cash at the fill</text>
  <rect x="516" y="126" width="70" height="19" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
  <text x="551" y="140" font-size="11.5" font-weight="500" fill="#2E8B5F" text-anchor="middle">+$200</text>
  <text x="416" y="166" font-size="11.5" fill="#14151C">Assigned, you deliver 100 shares at 50 —</text>
  <text x="416" y="182" font-size="11.5" fill="#14151C">owned already, or bought at that day's price.</text>
  <text x="416" y="206" font-size="11.5" font-weight="500" fill="#B4485C">Someone else decides; you are told after.</text>

  <!-- long put -->
  <rect x="84" y="234" width="300" height="140" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <rect x="100" y="248" width="122" height="22" rx="5" fill="#FFFFFF" stroke="#E2E5EE"/>
  <text x="161" y="263" font-size="11.5" font-weight="600" fill="#14151C" text-anchor="middle">+1 · a right</text>
  <text x="100" y="292" font-size="11" fill="#767B8E">Cash at the fill</text>
  <rect x="200" y="278" width="70" height="19" rx="4" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="235" y="292" font-size="11.5" font-weight="500" fill="#B4485C" text-anchor="middle">&#8722;$200</text>
  <text x="100" y="318" font-size="11.5" fill="#14151C">Exercise it and you sell 100 shares at 50,</text>
  <text x="100" y="334" font-size="11.5" fill="#14151C">receiving $5,000 for them.</text>
  <text x="100" y="358" font-size="11.5" font-weight="500" fill="#14151C">Unless it expires worthless, you decide.</text>

  <!-- short put -->
  <rect x="400" y="234" width="300" height="140" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <rect x="416" y="248" width="152" height="22" rx="5" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="492" y="263" font-size="11.5" font-weight="600" fill="#B4485C" text-anchor="middle">&#8722;1 · an obligation</text>
  <text x="416" y="292" font-size="11" fill="#767B8E">Cash at the fill</text>
  <rect x="516" y="278" width="70" height="19" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
  <text x="551" y="292" font-size="11.5" font-weight="500" fill="#2E8B5F" text-anchor="middle">+$200</text>
  <text x="416" y="318" font-size="11.5" fill="#14151C">Assigned, you take in 100 shares at 50 and</text>
  <text x="416" y="334" font-size="11.5" fill="#14151C">pay $5,000, whatever they are worth then.</text>
  <text x="416" y="358" font-size="11.5" font-weight="500" fill="#B4485C">Someone else decides; you are told after.</text>

  <text x="24" y="394" font-size="11" fill="#767B8E">Hypothetical figures, for the mechanics only. Both sold positions also hold collateral until the position is gone.</text>
</svg>
