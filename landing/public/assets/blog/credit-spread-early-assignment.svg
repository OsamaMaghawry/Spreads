<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Before assignment the position is two option legs with $380 of collateral held. After assignment on the short put it is 100 shares bought at the strike for a $10,000 debit, plus the long put, with the loss still capped but the cash already gone.">
  <rect width="720" height="300" fill="#FFFFFF"/>

  <!-- left panel: the position -->
  <rect x="16" y="16" width="320" height="248" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="40" y="44" font-size="12.5" font-weight="600" fill="#2E8B5F">Before: one position, two legs</text>

  <rect x="40" y="66" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="140" y="85" font-size="11.5" text-anchor="middle" fill="#14151C">Short 100 put — obligation</text>

  <rect x="40" y="114" width="200" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="140" y="133" font-size="11.5" text-anchor="middle" fill="#14151C">Long 95 put — a right</text>

  <path d="M240 81 C 264 81, 264 129, 240 129" fill="none" stroke="#2E8B5F" stroke-width="2"/>
  <text x="272" y="109" font-size="11" font-weight="500" fill="#2E8B5F">$5 wide</text>

  <text x="40" y="176" font-size="11.5" fill="#4B4F60">Credit received at the fill: $120</text>
  <text x="40" y="196" font-size="11.5" fill="#4B4F60">Collateral held against it: $380</text>
  <text x="40" y="216" font-size="11.5" fill="#4B4F60">Worst case at expiration: $380</text>
  <text x="40" y="240" font-size="11" fill="#767B8E">No shares, no cash outlay beyond the hold.</text>

  <!-- arrow -->
  <line x1="344" y1="140" x2="372" y2="140" stroke="#767B8E" stroke-width="1.5"/>
  <path d="M372 140 L365 136 L365 144 Z" fill="#767B8E"/>

  <!-- right panel: after assignment -->
  <rect x="384" y="16" width="320" height="248" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="408" y="44" font-size="12.5" font-weight="600" fill="#B4485C">After: assigned on the short leg</text>

  <rect x="408" y="60" width="210" height="46" rx="6" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="420" y="79" font-size="11.5" fill="#14151C">100 shares, bought at 100</text>
  <text x="420" y="96" font-size="11.5" font-weight="500" fill="#B4485C">$10,000 debit, settled next day</text>

  <rect x="408" y="118" width="210" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="513" y="137" font-size="11.5" text-anchor="middle" fill="#14151C">Long 95 put — still yours</text>

  <text x="408" y="180" font-size="11.5" fill="#4B4F60">The put still floors the shares at $9,500,</text>
  <text x="408" y="198" font-size="11.5" fill="#4B4F60">so the capped figure is unchanged: $380.</text>
  <text x="408" y="222" font-size="11.5" font-weight="500" fill="#B4485C">The notice arrives before the open. The</text>
  <text x="408" y="238" font-size="11.5" font-weight="500" fill="#B4485C">shares are held through the gap regardless.</text>

  <text x="24" y="286" font-size="11" fill="#767B8E">Hypothetical figures, mechanics only. Assignment is the option holder's decision, made after the close and reported to the seller afterwards.</text>
</svg>
