<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Two horizontal bars drawn to the same dollar scale. The top bar is 100 hypothetical XYZ shares at 5,000, one solid block. The bottom bar is one 24-month 40 call at 1,558, split into 1,000 of intrinsic value and 558 of time value, followed by a dashed outline for the 3,442 left over as cash.">
  <rect width="720" height="250" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="16" font-weight="600" fill="#14151C">100 shares</text>
  <rect x="40" y="64" width="640" height="46" rx="4" fill="#767B8E"/>
  <text x="360" y="93" font-size="18" font-weight="600" text-anchor="middle" fill="#FFFFFF">5,000</text>

  <text x="40" y="154" font-size="16" font-weight="600" fill="#14151C">One 40 call</text>
  <rect x="40" y="166" width="128" height="46" rx="4" fill="#14151C"/>
  <rect x="168" y="166" width="71" height="46" rx="4" fill="#B4485C"/>
  <rect x="239" y="166" width="441" height="46" rx="4" fill="none" stroke="#C9CEDC" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="104" y="195" font-size="16" font-weight="600" text-anchor="middle" fill="#FFFFFF">1,000</text>
  <text x="203.5" y="236" font-size="14" text-anchor="middle" fill="#B4485C">time value 558</text>
  <text x="104" y="236" font-size="14" text-anchor="middle" fill="#14151C">intrinsic</text>
  <text x="460" y="195" font-size="16" text-anchor="middle" fill="#767B8E">cash left 3,442</text>
</svg>
