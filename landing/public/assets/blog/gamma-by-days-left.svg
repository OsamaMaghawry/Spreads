<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="The delta of the same hypothetical 50-strike call plotted twice against the price of the stock: once with 30 days left and once with 7 days left. With 30 days left the curve rises gradually across the whole range. With 7 days left the curve is almost flat away from the strike and then rises very steeply through it, passing from about 0.24 at 48 dollars to about 0.77 at 52 dollars. The shorter-dated curve is steeper at the strike and flatter away from it, which is gamma concentrating near the money as expiration approaches.">
