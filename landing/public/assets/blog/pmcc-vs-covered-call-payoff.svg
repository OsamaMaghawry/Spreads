<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Gain or loss per share when the short call expires, for two hypothetical XYZ positions that sold the same 30-day 52 call for 1.47 with the stock at 50. The covered call, 100 shares bought at 50, runs from a 12.53 loss with the stock at 36 to a flat 3.47 gain at and above 52. The poor man's covered call, a 120-day 40 call bought for 10.90, opened for a 9.43 net debit, starts from a smaller 8.01 loss at 36, crosses zero near 48.69, peaks near 2.96 at 52, then eases toward 2.57, which sits 0.90 below the covered call: the time value paid for the long call.">
