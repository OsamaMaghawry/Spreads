<svg viewBox="0 0 720 306" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="The same contract after buying and after selling: quantity plus one with $120 of cash paid and nothing further reserved, against quantity minus one with $120 of cash received and collateral held until the line is gone.">
  <defs>
    <pattern id="hatchbs" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B4485C" stroke-width="1.4" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="720" height="306" fill="#FFFFFF"/>

  <!-- left: bought -->
  <rect x="16" y="16" width="336" height="250" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="36" y="42" font-size="12.5" font-weight="600" fill="#14151C">After buying one</text>

  <rect x="36" y="56" width="296" height="28" rx="5" fill="#FFFFFF" stroke="#E2E5EE"/>
  <text x="46" y="75" font-size="11.5" fill="#14151C">XYZ 18 DEC 2026 50 Call</text>
  <text x="322" y="75" font-size="12.5" font-weight="600" fill="#14151C" text-anchor="end">+1</text>
  <text x="36" y="102" font-size="11.5" fill="#767B8E">Quantity positive: the right is yours to use or not.</text>

  <text x="36" y="136" font-size="12" fill="#767B8E">Cash</text>
  <rect x="112" y="122" width="72" height="20" rx="4" fill="#FBE7EB" stroke="#B4485C"/>
  <text x="148" y="136" font-size="12" font-weight="500" fill="#B4485C" text-anchor="middle">&#8722;$120</text>
  <text x="36" y="160" font-size="11.5" fill="#4B4F60">Paid at the fill, and the whole of what this line can lose.</text>

  <text x="36" y="194" font-size="12" fill="#767B8E">Held</text>
  <rect x="112" y="180" width="72" height="20" rx="4" fill="#FFFFFF" stroke="#E2E5EE"/>
  <text x="148" y="194" font-size="12" fill="#4B4F60" text-anchor="middle">nothing</text>
  <text x="36" y="218" font-size="11.5" fill="#4B4F60">No further collateral. The debit was the whole cost.</text>

  <text x="36" y="250" font-size="11.5" font-weight="500" fill="#14151C">You decide whether it is ever exercised.</text>

  <!-- right: sold -->
  <rect x="368" y="16" width="336" height="250" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="388" y="42" font-size="12.5" font-weight="600" fill="#14151C">After selling one</text>

  <rect x="388" y="56" width="296" height="28" rx="5" fill="#FFFFFF" stroke="#E2E5EE"/>
  <text x="398" y="75" font-size="11.5" fill="#14151C">XYZ 18 DEC 2026 50 Call</text>
  <text x="674" y="75" font-size="12.5" font-weight="600" fill="#14151C" text-anchor="end">&#8722;1</text>
  <text x="388" y="102" font-size="11.5" fill="#767B8E">Quantity negative: the obligation is yours to meet.</text>

  <text x="388" y="136" font-size="12" fill="#767B8E">Cash</text>
  <rect x="464" y="122" width="72" height="20" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
  <text x="500" y="136" font-size="12" font-weight="500" fill="#2E8B5F" text-anchor="middle">+$120</text>
  <text x="388" y="160" font-size="11.5" fill="#4B4F60">Received at the fill, and it is the whole of the credit.</text>

  <text x="388" y="194" font-size="12" fill="#767B8E">Held</text>
  <rect x="464" y="180" width="220" height="20" rx="4" fill="#FBE7EB" stroke="#B4485C"/>
  <rect x="464" y="180" width="220" height="20" rx="4" fill="url(#hatchbs)"/>
  <text x="574" y="194" font-size="11" font-weight="500" fill="#B4485C" text-anchor="middle">collateral, bar not to a dollar scale</text>
  <text x="388" y="218" font-size="11.5" fill="#B4485C">Held until the line leaves the account — how much depends on the structure.</text>

  <text x="388" y="250" font-size="11.5" font-weight="500" fill="#14151C">Someone else decides, and you are told after.</text>

  <text x="16" y="292" font-size="11" fill="#767B8E">Same contract, opposite signs. The cash moves once at the fill; on the short side the collateral stays for the life of the position.</text>
</svg>
