<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Three timelines of the same protective put roll, with time running left to right. Filled as one order, the old put ends and the new put starts at the same moment. With the old put sold first, there is a stretch with no put and no floor under the shares before the new put fills. With the new put bought first, there is a stretch where the shares carry two puts before the old one is sold.">
  <rect width="720" height="300" fill="#FFFFFF"/>

  <!-- legend -->
  <rect x="200" y="20" width="16" height="16" fill="#767B8E" fill-opacity="0.45"/>
  <text x="224" y="33" font-size="15" fill="#767B8E">old put</text>
  <rect x="320" y="20" width="16" height="16" fill="#14151C"/>
  <text x="344" y="33" font-size="15" fill="#767B8E">new put</text>

  <!-- row 1: one order -->
  <text x="40" y="96" font-size="17" font-weight="600" fill="#14151C">One order</text>
  <rect x="200" y="74" width="240" height="32" fill="#767B8E" fill-opacity="0.45"/>
  <rect x="440" y="74" width="240" height="32" fill="#14151C"/>

  <!-- row 2: old put sold first -->
  <text x="40" y="176" font-size="17" font-weight="600" fill="#14151C">Sell first</text>
  <rect x="200" y="154" width="200" height="32" fill="#767B8E" fill-opacity="0.45"/>
  <rect x="400" y="154" width="80" height="32" fill="#FFFFFF" stroke="#B4485C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="176" font-size="15" font-weight="600" text-anchor="middle" fill="#B4485C">no floor</text>
  <rect x="480" y="154" width="200" height="32" fill="#14151C"/>

  <!-- row 3: new put bought first -->
  <text x="40" y="256" font-size="17" font-weight="600" fill="#14151C">Buy first</text>
  <rect x="200" y="230" width="280" height="15" fill="#767B8E" fill-opacity="0.45"/>
  <rect x="400" y="249" width="280" height="15" fill="#14151C"/>
  <rect x="400" y="226" width="80" height="42" fill="none" stroke="#14151C" stroke-width="2"/>
  <text x="440" y="288" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">two puts</text>
</svg>
