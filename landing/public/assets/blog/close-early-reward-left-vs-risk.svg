<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A hypothetical 50/48 put credit spread sold for 70 dollars, with a 200 dollar width. At the open the bar is 70 dollars of credit and 130 dollars of max loss. Three weeks later, with the spread quoted at 0.22, 48 dollars of the credit would be kept by closing, 22 dollars is still to be earned by holding, and the same 130 dollars is still at risk.">
  <rect width="720" height="220" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="12.5" font-weight="600" fill="#14151C">One 50/48 put credit spread, $2 wide, $200 per contract</text>

  <text x="24" y="66" font-size="11.5" fill="#767B8E">At the open</text>
  <rect x="24" y="74" width="210" height="34" fill="#2E8B5F"/>
  <rect x="234" y="74" width="390" height="34" fill="#B4485C"/>
  <text x="129" y="96" font-size="11.5" font-weight="500" text-anchor="middle" fill="#FFFFFF">$70 credit</text>
  <text x="429" y="96" font-size="11.5" font-weight="500" text-anchor="middle" fill="#FFFFFF">$130 max loss</text>

  <text x="24" y="138" font-size="11.5" fill="#767B8E">Three weeks in, spread ask 0.22</text>
  <rect x="24" y="146" width="144" height="34" fill="#2E8B5F"/>
  <rect x="168" y="146" width="66" height="34" fill="#FFFFFF" stroke="#2E8B5F" stroke-dasharray="4 3"/>
  <rect x="234" y="146" width="390" height="34" fill="#B4485C"/>
  <text x="96" y="168" font-size="11.5" font-weight="500" text-anchor="middle" fill="#FFFFFF">$48 kept</text>
  <text x="201" y="168" font-size="11.5" font-weight="500" text-anchor="middle" fill="#14151C">$22</text>
  <text x="429" y="168" font-size="11.5" font-weight="500" text-anchor="middle" fill="#FFFFFF">$130 still at risk</text>

  <text x="24" y="206" font-size="11" fill="#767B8E">Hypothetical figures, mechanics only. Dashed box: the credit not yet earned. Fees not included.</text>
</svg>
