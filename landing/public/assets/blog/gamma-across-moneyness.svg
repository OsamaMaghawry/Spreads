<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Three horizontal bars showing the gamma of the same hypothetical 50-strike call at three stock prices, each bar drawn against a light track that runs the full range from zero to 0.08. With the stock at 44 the strike is far out of the money and gamma is 0.05. With the stock at 50 the strike is at the money and gamma is 0.07, the longest bar of the three. With the stock at 56 the strike is deep in the money and gamma is 0.04, the shortest bar. Unlike delta, gamma does not climb as the stock rises: it peaks at the strike and falls away on both sides.">
  <rect width="720" height="300" fill="#FFFFFF"/>

  <text x="128" y="80" font-size="15" text-anchor="end" fill="#767B8E">stock</text>
  <text x="640" y="80" font-size="15" fill="#767B8E">gamma</text>

  <!-- stock at 44: gamma 0.05 -->
  <text x="128" y="126" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">$44</text>
  <rect x="144" y="106" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="106" width="300" height="28" rx="4" fill="#2E8B5F"/>
  <text x="640" y="126" font-size="18" font-weight="600" fill="#14151C">0.05</text>

  <!-- stock at 50: gamma 0.07 -->
  <text x="128" y="186" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">$50</text>
  <rect x="144" y="166" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="166" width="420" height="28" rx="4" fill="#2E8B5F"/>
  <text x="640" y="186" font-size="18" font-weight="600" fill="#14151C">0.07</text>

  <!-- stock at 56: gamma 0.04 -->
  <text x="128" y="246" font-size="18" font-weight="600" text-anchor="end" fill="#767B8E">$56</text>
  <rect x="144" y="226" width="480" height="28" rx="4" fill="#F1F2F6"/>
  <rect x="144" y="226" width="240" height="28" rx="4" fill="#2E8B5F"/>
  <text x="640" y="246" font-size="18" font-weight="600" fill="#14151C">0.04</text>

  <!-- scale -->
  <text x="144" y="278" font-size="13" fill="#767B8E">0</text>
  <text x="624" y="278" font-size="13" text-anchor="end" fill="#767B8E">0.08</text>
</svg>
