<svg viewBox="0 0 720 290" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="How much the same hypothetical 46/44 put credit spread's mark rises when the stock falls $4 to the 46 short strike, at five points in its life. The rise is $39 with 60 days left, $43 with 45, $50 with 30, $61 with 14 and $65 with 7. The same fall costs more as expiration nears.">
  <rect width="720" height="290" fill="#FFFFFF"/>
  <text x="158" y="41" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">60 days</text>
  <rect x="170" y="24" width="234.0" height="24" fill="#B4485C" fill-opacity="0.85"/>
  <text x="412.0" y="41" font-size="14" font-weight="600" fill="#14151C">+$39</text>
  <text x="158" y="89" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">45 days</text>
  <rect x="170" y="72" width="258.0" height="24" fill="#B4485C" fill-opacity="0.85"/>
  <text x="436.0" y="89" font-size="14" font-weight="600" fill="#14151C">+$43</text>
  <text x="158" y="137" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">30 days</text>
  <rect x="170" y="120" width="300.0" height="24" fill="#B4485C" fill-opacity="0.85"/>
  <text x="478.0" y="137" font-size="14" font-weight="600" fill="#14151C">+$50</text>
  <text x="158" y="185" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">14 days</text>
  <rect x="170" y="168" width="366.0" height="24" fill="#B4485C" fill-opacity="0.85"/>
  <text x="544.0" y="185" font-size="14" font-weight="600" fill="#14151C">+$61</text>
  <text x="158" y="233" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">7 days</text>
  <rect x="170" y="216" width="390.0" height="24" fill="#B4485C" fill-opacity="0.85"/>
  <text x="568.0" y="233" font-size="14" font-weight="600" fill="#14151C">+$65</text>
</svg>
