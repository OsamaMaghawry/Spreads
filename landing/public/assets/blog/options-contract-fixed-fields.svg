<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="One listed option broken into its fields: underlying, expiration, type and strike are fixed by the listing, the premium is the only field the market sets, and the 100 multiplier turns a $1.20 quote into $120 per contract.">
  <rect width="720" height="330" fill="#FFFFFF"/>

  <text x="24" y="38" font-size="13.5" font-weight="600" fill="#14151C">One listed contract, field by field</text>

  <!-- the four fixed fields -->
  <rect x="24" y="56" width="112" height="42" rx="6" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="80" y="83" font-size="14" font-weight="500" fill="#14151C" text-anchor="middle">XYZ</text>
  <text x="80" y="118" font-size="11.5" fill="#767B8E" text-anchor="middle">Underlying</text>

  <rect x="144" y="56" width="132" height="42" rx="6" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="210" y="83" font-size="14" font-weight="500" fill="#14151C" text-anchor="middle">18 DEC 2026</text>
  <text x="210" y="118" font-size="11.5" fill="#767B8E" text-anchor="middle">Expiration</text>

  <rect x="284" y="56" width="96" height="42" rx="6" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="332" y="83" font-size="14" font-weight="500" fill="#14151C" text-anchor="middle">CALL</text>
  <text x="332" y="118" font-size="11.5" fill="#767B8E" text-anchor="middle">Type</text>

  <rect x="388" y="56" width="96" height="42" rx="6" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="436" y="83" font-size="14" font-weight="500" fill="#14151C" text-anchor="middle">50</text>
  <text x="436" y="118" font-size="11.5" fill="#767B8E" text-anchor="middle">Strike</text>

  <!-- the one field that is not fixed -->
  <rect x="536" y="56" width="160" height="42" rx="6" fill="#DFF1E7" stroke="#2E8B5F"/>
  <text x="616" y="83" font-size="14" font-weight="500" fill="#2E8B5F" text-anchor="middle">$1.20</text>
  <text x="616" y="118" font-size="11.5" fill="#767B8E" text-anchor="middle">Premium</text>

  <line x1="510" y1="50" x2="510" y2="132" stroke="#E2E5EE" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- brackets -->
  <path d="M24 138 L24 146 L484 146 L484 138" fill="none" stroke="#767B8E" stroke-width="1"/>
  <text x="24" y="166" font-size="11.5" fill="#4B4F60">Fixed by the listing. Every trader in this contract has the identical fields shown here.</text>

  <path d="M536 138 L536 146 L696 146 L696 138" fill="none" stroke="#2E8B5F" stroke-width="1"/>
  <text x="696" y="166" font-size="11.5" fill="#2E8B5F" text-anchor="end">The only field the market sets.</text>

  <line x1="24" y1="196" x2="696" y2="196" stroke="#E2E5EE" stroke-width="1"/>

  <!-- multiplier -->
  <text x="24" y="224" font-size="13.5" font-weight="600" fill="#14151C">The multiplier turns the quote into money</text>

  <rect x="24" y="242" width="86" height="30" rx="6" fill="#FFFFFF" stroke="#2E8B5F"/>
  <text x="67" y="262" font-size="13" font-weight="500" fill="#2E8B5F" text-anchor="middle">$1.20</text>
  <text x="67" y="292" font-size="11" fill="#767B8E" text-anchor="middle">per share</text>

  <text x="128" y="262" font-size="12.5" fill="#4B4F60">&#215; 100</text>
  <line x1="180" y1="257" x2="222" y2="257" stroke="#767B8E" stroke-width="1"/>
  <path d="M222 253 L230 257 L222 261 Z" fill="#767B8E"/>

  <rect x="242" y="242" width="86" height="30" rx="6" fill="#DFF1E7" stroke="#2E8B5F"/>
  <text x="285" y="262" font-size="13" font-weight="500" fill="#2E8B5F" text-anchor="middle">$120</text>
  <text x="285" y="292" font-size="11" fill="#767B8E" text-anchor="middle">per contract</text>

  <text x="376" y="252" font-size="11.5" fill="#4B4F60">Strike 50 &#215; 100 = $5,000 of stock referenced</text>
  <text x="376" y="270" font-size="11.5" fill="#4B4F60">by the same single contract.</text>

  <text x="24" y="320" font-size="11" fill="#767B8E">Hypothetical ticker and hypothetical price, shown for the arithmetic only.</text>
</svg>
