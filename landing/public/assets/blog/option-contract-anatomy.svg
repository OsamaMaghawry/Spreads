<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="One hypothetical call contract: underlying, strike $50, expiration in six weeks and $2.00 premium fixed at the fill, with the buyer paying $200 for the right to buy and the seller receiving $200 for the obligation to sell.">
  <rect width="720" height="340" fill="#FFFFFF"/>

  <text x="24" y="34" font-size="13.5" font-weight="600" fill="#14151C">One hypothetical call contract, fixed at the fill</text>

  <!-- the four fixed numbers -->
  <g font-size="11.5">
    <rect x="24" y="52" width="160" height="50" rx="6" fill="#F6F5FB" stroke="#E2E5EE"/>
    <text x="34" y="70" fill="#767B8E">Underlying</text>
    <text x="34" y="90" fill="#14151C" font-weight="600">the stock</text>

    <rect x="194" y="52" width="160" height="50" rx="6" fill="#F6F5FB" stroke="#E2E5EE"/>
    <text x="204" y="70" fill="#767B8E">Strike</text>
    <text x="204" y="90" fill="#14151C" font-weight="600">$50</text>

    <rect x="364" y="52" width="160" height="50" rx="6" fill="#F6F5FB" stroke="#E2E5EE"/>
    <text x="374" y="70" fill="#767B8E">Expiration</text>
    <text x="374" y="90" fill="#14151C" font-weight="600">6 weeks out</text>

    <rect x="534" y="52" width="162" height="50" rx="6" fill="#F6F5FB" stroke="#E2E5EE"/>
    <text x="544" y="70" fill="#767B8E">Premium</text>
    <text x="544" y="90" fill="#14151C" font-weight="600">$2.00/share</text>
  </g>

  <!-- buyer and seller -->
  <rect x="24" y="140" width="290" height="150" rx="8" fill="#FFFFFF" stroke="#E2E5EE" stroke-width="1.5"/>
  <text x="44" y="170" font-size="13" font-weight="600" fill="#14151C">Buyer</text>
  <text x="44" y="194" font-size="12" fill="#4B4F60">Pays $200 at the fill</text>
  <text x="44" y="216" font-size="12" fill="#4B4F60">Holds the right to buy</text>
  <text x="44" y="236" font-size="12" fill="#4B4F60">100 shares at $50</text>
  <text x="44" y="264" font-size="11.5" fill="#767B8E">Decides whether to use it</text>

  <rect x="406" y="140" width="290" height="150" rx="8" fill="#FFFFFF" stroke="#E2E5EE" stroke-width="1.5"/>
  <text x="426" y="170" font-size="13" font-weight="600" fill="#14151C">Seller</text>
  <text x="426" y="194" font-size="12" fill="#4B4F60">Receives $200 at the fill</text>
  <text x="426" y="216" font-size="12" fill="#4B4F60">Takes the obligation to sell</text>
  <text x="426" y="236" font-size="12" fill="#4B4F60">100 shares at $50, if asked</text>
  <text x="426" y="264" font-size="11.5" fill="#767B8E">Someone else decides</text>

  <!-- premium arrow -->
  <line x1="314" y1="190" x2="404" y2="190" stroke="#2E8B5F" stroke-width="2"/>
  <polygon points="404,190 393,184 393,196" fill="#2E8B5F"/>
  <rect x="317" y="200" width="86" height="20" rx="4" fill="#2E8B5F"/>
  <text x="360" y="214" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">$200, once</text>

  <text x="24" y="320" font-size="11" fill="#767B8E">Hypothetical figures, for the arithmetic only. The $200 premium moves once, at the fill, whether or not the right is ever used.</text>
</svg>
