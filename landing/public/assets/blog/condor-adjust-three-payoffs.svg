<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Result at expiration, per share, of a hypothetical 46/48/52/54 iron condor after XYZ falls to 47, under three choices. Holding it unchanged keeps a plateau of 1.03 between 48 and 52 and loses at most 0.97. Closing the tested put wing and keeping the call wing leaves a flat result of minus 0.12 up to 52 and a maximum loss of 2.12 above 54. Rolling the put wing down to 46 and 44 gives a plateau of 0.33 between 46 and 52 and a maximum loss of 1.67 on either side.">
  <rect width="720" height="360" fill="#FFFFFF"/>

  <line x1="80" y1="150" x2="660" y2="150" stroke="#C9CEDC" stroke-width="1.5"/>
  <line x1="162.9" y1="40" x2="162.9" y2="300" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="245.7" y1="40" x2="245.7" y2="300" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="328.6" y1="40" x2="328.6" y2="300" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="494.3" y1="40" x2="494.3" y2="300" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="577.1" y1="40" x2="577.1" y2="300" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="162.9" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">44</text>
  <text x="245.7" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">46</text>
  <text x="328.6" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">48</text>
  <text x="494.3" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">52</text>
  <text x="577.1" y="326" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">54</text>

  <!-- stock now -->
  <line x1="287.1" y1="40" x2="287.1" y2="300" stroke="#14151C" stroke-width="1.5"/>
  <text x="287.1" y="32" font-size="13" font-weight="600" text-anchor="middle" fill="#14151C">XYZ now: 47</text>

  <!-- close the put wing -->
  <path d="M80 158.4 L494.3 158.4 L577.1 298.4 L660 298.4" fill="none" stroke="#B4485C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/>
  <text x="660" y="318" font-size="14" font-weight="600" text-anchor="end" fill="#B4485C">close put wing</text>

  <!-- hold -->
  <path d="M80 217.9 L245.7 217.9 L328.6 77.9 L494.3 77.9 L577.1 217.9 L660 217.9" fill="none" stroke="#767B8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6"/>
  <text x="411.4" y="66" font-size="14" font-weight="600" text-anchor="middle" fill="#767B8E">hold</text>

  <!-- roll the put wing down -->
  <path d="M80 266.9 L162.9 266.9 L245.7 126.9 L494.3 126.9 L577.1 266.9 L660 266.9" fill="none" stroke="#14151C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="411.4" y="116" font-size="14" font-weight="600" text-anchor="middle" fill="#14151C">roll put wing down</text>

  <text x="72" y="154" font-size="12" text-anchor="end" fill="#767B8E">0</text>
  <text x="370" y="352" font-size="14" text-anchor="middle" fill="#767B8E">XYZ at expiration. Hypothetical, per share.</text>
</svg>
