<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Scatter chart of twenty hypothetical open spreads. The horizontal axis is days left to expiration and the vertical axis is the cushion between the stock and the short strike as a percent of the stock. Fourteen faint dots sit mostly toward the upper right. Six labelled spreads A to F are spread out: F is in the money with 4 days left, A has 6 days and a 2.3 percent cushion, C has 12 days and 3.2 percent, D has 9 days and 5.6 percent, E has 27 days and 6.5 percent, and B has 34 days and 11.1 percent. A shaded corner at lower left marks the positions with few days and a thin cushion.">
