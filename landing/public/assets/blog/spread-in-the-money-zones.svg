<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Result at expiration of a hypothetical 50/45 put credit spread sold for 150 dollars, by where the stock finishes. Below 45 both puts are in the money and the loss is the full 350 dollars. From 45 to 48.50 only the short put is in the money and the loss shrinks from 350 dollars to zero. From 48.50 to 50 the short put is in the money but a smaller gain is kept, up to 150 dollars. At 50 and above neither put is in the money and the full 150 dollars is kept.">
  <rect width="720" height="250" fill="#FFFFFF"/>
  <text x="24" y="30" font-size="12.5" font-weight="600" fill="#14151C">One 50/45 put credit spread sold for $150: the result at expiration, by where XYZ finishes</text>

  <text x="150" y="68" font-size="11.5" text-anchor="middle" fill="#767B8E">both puts in the money</text>
  <text x="390" y="68" font-size="11.5" text-anchor="middle" fill="#767B8E">only the 50 put in the money</text>
  <text x="600" y="68" font-size="11.5" text-anchor="middle" fill="#767B8E">neither in the money</text>
  <line x1="240" y1="74" x2="240" y2="82" stroke="#767B8E"/>
  <line x1="540" y1="74" x2="540" y2="82" stroke="#767B8E"/>

  <rect x="60" y="86" width="180" height="44" fill="#B4485C"/>
  <rect x="240" y="86" width="210" height="44" fill="#E9C7CE"/>
  <rect x="450" y="86" width="90" height="44" fill="#BFE0CF"/>
  <rect x="540" y="86" width="120" height="44" fill="#2E8B5F"/>
  <text x="150" y="113" font-size="12" font-weight="500" text-anchor="middle" fill="#FFFFFF">-$350, the max loss</text>
  <text x="345" y="113" font-size="12" font-weight="500" text-anchor="middle" fill="#14151C">loss shrinks to $0</text>
  <text x="495" y="113" font-size="12" font-weight="500" text-anchor="middle" fill="#14151C">gain up to $150</text>
  <text x="600" y="113" font-size="12" font-weight="500" text-anchor="middle" fill="#FFFFFF">+$150, all kept</text>

  <g font-size="11.5" fill="#14151C" text-anchor="middle">
    <line x1="60" y1="130" x2="60" y2="138" stroke="#767B8E"/><text x="60" y="153">42</text>
    <line x1="240" y1="130" x2="240" y2="138" stroke="#767B8E"/><text x="240" y="153">45</text>
    <line x1="450" y1="130" x2="450" y2="138" stroke="#767B8E"/><text x="450" y="153">48.50</text>
    <line x1="540" y1="130" x2="540" y2="138" stroke="#767B8E"/><text x="540" y="153">50</text>
    <line x1="660" y1="130" x2="660" y2="138" stroke="#767B8E"/><text x="660" y="153">52</text>
  </g>
  <g font-size="11" fill="#767B8E" text-anchor="middle">
    <text x="240" y="170">long put strike</text>
    <text x="450" y="170">break-even</text>
    <text x="540" y="170">short put strike</text>
  </g>

  <text x="24" y="208" font-size="11.5" fill="#14151C">Between 45 and 50 the result depends on the stock. At expiration, below 45 it is the same.</text>
  <text x="24" y="238" font-size="11" fill="#767B8E">Hypothetical figures, mechanics only. One contract, fees not included.</text>
</svg>
