<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Profit and loss in dollars at expiration against the XYZ price, for a hypothetical 40 call bought at 15.58 (one contract, 1,558) and for 100 shares bought at 50. The shares line rises one for one from a loss of 2,000 at 30 to a gain of 2,000 at 70. The call is flat at a loss of 1,558 at and below 40, then rises with the shares but 558 lower, breaking even at 55.58. A shaded wedge marks the range below 34.42 where the call loses less than the shares, and a second band marks the range above it where the call trails.">
  <rect width="720" height="340" fill="#FFFFFF"/>

  <!-- zero line -->
  <line x1="80" y1="175" x2="660" y2="175" stroke="#C9CEDC" stroke-width="1.5"/>
  <text x="70" y="180" font-size="14" text-anchor="end" fill="#767B8E">0</text>

  <!-- strike guide -->
  <line x1="225" y1="40" x2="225" y2="295" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- call below shares: premium and time value given up -->
  <polygon points="144.1,272.4 225,272.4 660,84.9 660,50" fill="#B4485C" fill-opacity="0.2"/>
  <!-- call above shares: capped loss -->
  <polygon points="80,272.4 144.1,272.4 80,300" fill="#767B8E" fill-opacity="0.2"/>

  <!-- shares alone -->
  <path d="M80 300 L660 50" fill="none" stroke="#767B8E" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="600" y="44" font-size="15" text-anchor="end" fill="#767B8E">100 shares</text>

  <!-- the call -->
  <path d="M80 272.4 L225 272.4 L660 84.9" fill="none" stroke="#14151C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="660" y="130" font-size="17" font-weight="600" text-anchor="end" fill="#14151C">40 call</text>
  <text x="240" y="262" font-size="15" font-weight="600" fill="#14151C">max loss 1,558</text>

  <!-- break-even -->
  <circle cx="450.9" cy="175" r="6" fill="#FFFFFF" stroke="#14151C" stroke-width="2"/>
  <text x="466" y="198" font-size="15" font-weight="600" fill="#14151C">break-even 55.58</text>

  <!-- crossover -->
  <circle cx="144.1" cy="272.4" r="5" fill="#FFFFFF" stroke="#767B8E" stroke-width="2"/>
  <text x="150" y="294" font-size="14" font-weight="600" fill="#767B8E">34.42</text>

  <!-- axis -->
  <text x="80" y="318" font-size="15" text-anchor="middle" fill="#14151C">30</text>
  <text x="225" y="318" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">40</text>
  <text x="370" y="318" font-size="15" text-anchor="middle" fill="#14151C">50</text>
  <text x="515" y="318" font-size="15" text-anchor="middle" fill="#14151C">60</text>
  <text x="660" y="318" font-size="15" text-anchor="middle" fill="#14151C">70</text>
  <text x="370" y="336" font-size="14" text-anchor="middle" fill="#767B8E">XYZ at expiration, hypothetical</text>
</svg>
