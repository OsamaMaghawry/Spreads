<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Closing 4 of a 10-lot spread leaves 6 open; a per-execution tool instead records the full 10-lot plus a phantom 4-lot debit spread.">
  <defs>
    <pattern id="hatchp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B4485C" stroke-width="1.4" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="720" height="270" fill="#FFFFFF"/>

  <!-- left: reality -->
  <rect x="16" y="16" width="336" height="238" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="36" y="44" font-size="12.5" font-weight="600" fill="#2E8B5F">What you did</text>
  <text x="36" y="66" font-size="11.5" fill="#4B4F60">10-lot spread, closed 4 contracts</text>

  <!-- 10 segments: 6 open (mint) + 4 closed (outline) -->
  <g>
    <rect x="36" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="66" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="96" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="126" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="156" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="186" y="86" width="26" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <rect x="216" y="86" width="26" height="24" rx="4" fill="#FFFFFF" stroke="#767B8E" stroke-dasharray="3 3"/>
    <rect x="246" y="86" width="26" height="24" rx="4" fill="#FFFFFF" stroke="#767B8E" stroke-dasharray="3 3"/>
    <rect x="276" y="86" width="26" height="24" rx="4" fill="#FFFFFF" stroke="#767B8E" stroke-dasharray="3 3"/>
    <rect x="306" y="86" width="26" height="24" rx="4" fill="#FFFFFF" stroke="#767B8E" stroke-dasharray="3 3"/>
  </g>
  <text x="36" y="132" font-size="11.5" font-weight="500" fill="#2E8B5F">6 still open</text>
  <text x="216" y="132" font-size="11.5" fill="#767B8E">4 closed</text>

  <text x="36" y="176" font-size="11.5" fill="#4B4F60">One position. Collateral drops with it.</text>

  <!-- right: what a guesser records -->
  <rect x="368" y="16" width="336" height="238" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="388" y="44" font-size="12.5" font-weight="600" fill="#B4485C">What a per-execution tool records</text>
  <text x="388" y="66" font-size="11.5" fill="#4B4F60">The closes look like a new opening trade</text>

  <g>
    <rect x="388" y="86" width="296" height="24" rx="4" fill="#DFF1E7" stroke="#2E8B5F"/>
    <text x="396" y="102" font-size="11.5" fill="#14151C">10-lot still shown open — really 6</text>
  </g>
  <g>
    <rect x="388" y="122" width="140" height="24" rx="4" fill="#FBE7EB" stroke="#B4485C"/>
    <rect x="388" y="122" width="140" height="24" rx="4" fill="url(#hatchp)"/>
    <text x="536" y="138" font-size="11.5" font-weight="500" fill="#B4485C">phantom 4-lot debit spread</text>
  </g>

  <text x="388" y="186" font-size="11.5" fill="#B4485C">Two positions, neither real.</text>
  <text x="388" y="204" font-size="11.5" fill="#4B4F60">Collateral wrong in both directions at once.</text>
</svg>
