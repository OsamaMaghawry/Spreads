<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Year-end result of one hypothetical 100-share lot, in dollars, with no puts and with four quarterly 90-strike puts. In a calm year the lot with no puts ends at zero and the hedged lot at minus 480. In a crash year the lot with no puts ends at minus 3,000 and the hedged lot at minus 1,720. In a slow slide the lot with no puts ends at minus 1,000 and the hedged lot at minus 1,480, which is worse than having no puts.">
  <rect width="720" height="360" fill="#FFFFFF"/>

  <!-- legend -->
  <rect x="80" y="20" width="16" height="16" fill="#767B8E" fill-opacity="0.45"/>
  <text x="104" y="33" font-size="15" fill="#767B8E">no puts</text>
  <rect x="190" y="20" width="16" height="16" fill="#14151C"/>
  <text x="214" y="33" font-size="15" fill="#14151C">four puts</text>

  <!-- zero line -->
  <line x1="80" y1="70" x2="660" y2="70" stroke="#C9CEDC" stroke-width="1.5"/>

  <!-- calm -->
  <text x="180" y="64" font-size="15" text-anchor="middle" fill="#767B8E">0</text>
  <rect x="215" y="70" width="50" height="36" fill="#14151C"/>
  <text x="240" y="126" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">-480</text>
  <text x="210" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#14151C">Calm</text>

  <!-- crash -->
  <rect x="325" y="70" width="50" height="225" fill="#767B8E" fill-opacity="0.45"/>
  <text x="350" y="314" font-size="15" text-anchor="middle" fill="#767B8E">-3,000</text>
  <rect x="385" y="70" width="50" height="129" fill="#14151C"/>
  <text x="410" y="219" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">-1,720</text>

  <!-- slow slide -->
  <rect x="505" y="70" width="50" height="75" fill="#767B8E" fill-opacity="0.45"/>
  <text x="530" y="164" font-size="15" text-anchor="middle" fill="#767B8E">-1,000</text>
  <rect x="565" y="70" width="50" height="111" fill="#14151C"/>
  <text x="590" y="201" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">-1,480</text>

  <!-- group labels -->
  <text x="380" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#14151C">Crash</text>
  <text x="560" y="338" font-size="17" font-weight="600" text-anchor="middle" fill="#14151C">Slow slide</text>
</svg>
