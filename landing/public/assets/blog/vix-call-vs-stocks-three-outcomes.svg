<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Result of a hypothetical $100,000 stock holding and one VIX 20 call bought for 1.20, in three cases. VIX settles at 16 and stocks are flat: stocks $0, call minus $120. VIX settles at 30 and stocks fall 10 percent: stocks minus $10,000, call plus $880. VIX settles at 19 and stocks fall 10 percent: stocks minus $10,000, call minus $120.">
  <rect width="720" height="330" fill="#FFFFFF"/>
  <line x1="520" y1="14" x2="520" y2="290" stroke="#C9CEDC" stroke-width="1.5"/>

  <text x="24" y="32" font-size="16" font-weight="600" fill="#14151C">VIX settles 16, stocks flat</text>
  <text x="24" y="62" font-size="15" fill="#767B8E">Stocks</text>
  <text x="530" y="62" font-size="15" font-weight="600" fill="#14151C">$0</text>
  <text x="24" y="90" font-size="15" fill="#767B8E">VIX 20 call</text>
  <rect x="514" y="75" width="6" height="20" fill="#B4485C"/>
  <text x="440" y="91" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">-$120</text>

  <text x="24" y="132" font-size="16" font-weight="600" fill="#14151C">VIX settles 30, stocks down 10%</text>
  <rect x="140" y="140" width="380" height="24" fill="#B4485C"/>
  <text x="24" y="158" font-size="15" fill="#767B8E">Stocks</text>
  <text x="510" y="158" font-size="15" font-weight="600" text-anchor="end" fill="#FFFFFF">-$10,000</text>
  <text x="24" y="188" font-size="15" fill="#767B8E">VIX 20 call</text>
  <rect x="520" y="173" width="33" height="20" fill="#2E8B5F"/>
  <text x="563" y="189" font-size="15" font-weight="600" fill="#14151C">+$880</text>

  <text x="24" y="230" font-size="16" font-weight="600" fill="#14151C">VIX settles 19, stocks down 10%</text>
  <rect x="140" y="238" width="380" height="24" fill="#B4485C"/>
  <text x="24" y="256" font-size="15" fill="#767B8E">Stocks</text>
  <text x="510" y="256" font-size="15" font-weight="600" text-anchor="end" fill="#FFFFFF">-$10,000</text>
  <text x="24" y="286" font-size="15" fill="#767B8E">VIX 20 call</text>
  <rect x="514" y="271" width="6" height="20" fill="#B4485C"/>
  <text x="440" y="287" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">-$120</text>

  <text x="24" y="318" font-size="14" fill="#767B8E">Hypothetical $100,000 of stocks and one call, premium included</text>
</svg>
