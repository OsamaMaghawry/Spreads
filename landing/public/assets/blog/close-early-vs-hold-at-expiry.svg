<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Result in dollars of a hypothetical 50/48 put credit spread sold for 0.70, closed three weeks in at 0.22 versus held to expiration. Closed, the result is plus 48 dollars at every stock price. Held, it is plus 70 dollars with the stock at 52, minus 30 dollars at 49, and minus 130 dollars at 47.">
  <rect width="720" height="320" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="12.5" font-weight="600" fill="#14151C">Result by stock price at expiration</text>
  <line x1="24" y1="130" x2="696" y2="130" stroke="#767B8E" stroke-width="1"/>
  <text x="24" y="124" font-size="11" fill="#767B8E">$0</text>

  <rect x="110" y="82" width="70" height="48" fill="#2E8B5F"/>
  <rect x="190" y="60" width="70" height="70" fill="#2E8B5F" opacity="0.55"/>
  <text x="145" y="74" font-size="11.5" text-anchor="middle" fill="#14151C">+48</text>
  <text x="225" y="52" font-size="11.5" text-anchor="middle" fill="#14151C">+70</text>

  <rect x="310" y="82" width="70" height="48" fill="#2E8B5F"/>
  <rect x="390" y="130" width="70" height="30" fill="#B4485C" opacity="0.55"/>
  <text x="345" y="74" font-size="11.5" text-anchor="middle" fill="#14151C">+48</text>
  <text x="425" y="176" font-size="11.5" text-anchor="middle" fill="#14151C">-30</text>

  <rect x="510" y="82" width="70" height="48" fill="#2E8B5F"/>
  <rect x="590" y="130" width="70" height="130" fill="#B4485C" opacity="0.55"/>
  <text x="545" y="74" font-size="11.5" text-anchor="middle" fill="#14151C">+48</text>
  <text x="625" y="276" font-size="11.5" text-anchor="middle" fill="#14151C">-130</text>

  <text x="185" y="298" font-size="11.5" text-anchor="middle" fill="#14151C">Stock at 52</text>
  <text x="385" y="298" font-size="11.5" text-anchor="middle" fill="#14151C">Stock at 49</text>
  <text x="585" y="298" font-size="11.5" text-anchor="middle" fill="#14151C">Stock at 47</text>

  <rect x="24" y="226" width="12" height="12" fill="#4B4F60"/>
  <text x="42" y="236" font-size="11" fill="#767B8E">Closed at 0.22 (solid)</text>
  <rect x="24" y="246" width="12" height="12" fill="#4B4F60" opacity="0.45"/>
  <text x="42" y="256" font-size="11" fill="#767B8E">Held to expiration (lighter); green gain, red loss</text>
  <text x="24" y="314" font-size="11" fill="#767B8E">Hypothetical figures, mechanics only. Fees not included.</text>
</svg>
