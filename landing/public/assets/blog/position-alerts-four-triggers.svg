<circle cx="460" cy="330.9" r="11" fill="#B4485C"/><text x="460" y="335.9" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
<circle cx="580" cy="277.8" r="4" fill="#B4485C"/>
<circle cx="580" cy="299.8" r="11" fill="#B4485C"/><text x="580" y="304.8" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
