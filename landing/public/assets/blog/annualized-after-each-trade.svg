<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Five bars showing the simple annualized return on risk of a hypothetical record after each of five closed credit spreads, held one at a time. After each of the first four trades, each a 50 dollar gain over nine days, the figure reads plus 507 percent. After the fifth trade, a 400 dollar loss, it reads minus 406 percent.">
  <rect width="720" height="320" fill="#FFFFFF"/>
  <text x="680" y="32" font-size="12" fill="#767B8E" text-anchor="end">Hypothetical</text>
  <text x="40" y="32" font-size="13" fill="#767B8E">Annualized, simple</text>
  <line x1="60" y1="170" x2="680" y2="170" stroke="#14151C" stroke-width="1.5"/>
  <g fill="#2E8B5F">
    <rect x="100" y="60" width="70" height="110" rx="3"/>
    <rect x="215" y="60" width="70" height="110" rx="3"/>
    <rect x="330" y="60" width="70" height="110" rx="3"/>
    <rect x="445" y="60" width="70" height="110" rx="3"/>
  </g>
  <rect x="560" y="170" width="70" height="88" rx="3" fill="#B4485C"/>
  <g font-size="14" fill="#14151C" font-weight="600" text-anchor="middle">
    <text x="135" y="50">+507%</text>
    <text x="250" y="50">+507%</text>
    <text x="365" y="50">+507%</text>
    <text x="480" y="50">+507%</text>
    <text x="595" y="278">-406%</text>
  </g>
  <g font-size="13" fill="#767B8E" text-anchor="middle">
    <text x="135" y="190">1</text>
    <text x="250" y="190">2</text>
    <text x="365" y="190">3</text>
    <text x="480" y="190">4</text>
    <text x="595" y="160">5</text>
  </g>
  <text x="360" y="306" font-size="13" fill="#767B8E" text-anchor="middle">After each closed trade</text>
</svg>
