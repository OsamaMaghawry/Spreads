<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Total gain or loss at expiration, in dollars, of five hypothetical short 50-strike XYZ puts sold at 1.40, drawn alone and with five 46-strike puts bought at 0.45. Alone, the line is flat at a gain of 700 for every price at or above 50 and falls 500 dollars for each dollar below, reaching a loss of 4,300 at a price of 40. With the 46 puts, the line is flat at a gain of 475 at or above 50, sits 225 dollars below the first line between 46 and 50, and is flat at a loss of 1,525 for every price below 46. A green wedge shows the loss the bought puts remove, a red band the 225 they cost between and above the strikes.">
  <rect width="720" height="380" fill="#FFFFFF"/>

  <!-- zero line and strike guides -->
  <line x1="80" y1="90" x2="660" y2="90" stroke="#C9CEDC" stroke-width="1.5"/>
  <line x1="297.5" y1="30" x2="297.5" y2="335" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="442.5" y1="30" x2="442.5" y2="335" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="297.5" y="358" font-size="18" font-weight="600" text-anchor="middle" fill="#14151C">46</text>
  <text x="442.5" y="358" font-size="18" font-weight="600" text-anchor="middle" fill="#14151C">50</text>
  <text x="74" y="95" font-size="14" text-anchor="end" fill="#767B8E">0</text>

  <!-- loss removed below the floor -->
  <polygon points="281.2,173.9 80,326.5 80,173.9" fill="#2E8B5F" fill-opacity="0.18"/>

  <!-- cost of the bought puts between the strikes -->
  <polygon points="281.2,173.9 297.5,173.9 442.5,63.9 442.5,51.5" fill="#B4485C" fill-opacity="0.22"/>
  <polygon points="442.5,51.5 442.5,63.9 660,63.9 660,51.5" fill="#B4485C" fill-opacity="0.22"/>
  <text x="372" y="150" font-size="15" font-weight="600" text-anchor="middle" fill="#B4485C">costs 225</text>

  <!-- short puts alone -->
  <path d="M80 326.5 L442.5 51.5 L660 51.5" fill="none" stroke="#767B8E" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="96" y="318" font-size="15" fill="#767B8E">puts alone</text>
  <text x="660" y="42" font-size="15" text-anchor="end" fill="#767B8E">+700</text>

  <!-- with the 46 puts -->
  <path d="M80 173.9 L297.5 173.9 L442.5 63.9 L660 63.9" fill="none" stroke="#14151C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="660" y="106" font-size="17" font-weight="600" text-anchor="end" fill="#14151C">with 46 puts</text>
  <text x="96" y="196" font-size="15" font-weight="600" fill="#14151C">worst case -1,525</text>

  <!-- axis label -->
  <text x="370" y="376" font-size="15" text-anchor="middle" fill="#767B8E">XYZ at expiration</text>
</svg>
