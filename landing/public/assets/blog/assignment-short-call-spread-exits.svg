<svg viewBox="0 0 720 224" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A hypothetical call credit spread, short 105 call and long 110 call, with weeks to expiration. Before assignment the account holds two option legs. After the short call is assigned the day before an ex-dividend date, it is short 100 shares at 105 with the 110 call still held. Two exits follow. Exercising the long call buys 100 shares at 110 and nets minus 380 dollars at any stock price. Selling the call and buying the shares back nets minus 100 dollars with the stock at 108 and minus 305 dollars with the stock at 112.">
  <rect width="720" height="224" fill="#FFFFFF"/>

  <rect x="16" y="16" width="190" height="150" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="32" y="42" font-size="12.5" font-weight="600" fill="#14151C">Day before</text>
  <rect x="32" y="56" width="158" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="111" y="75" font-size="11.5" text-anchor="middle" fill="#14151C">Short 105 call</text>
  <rect x="32" y="98" width="158" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="111" y="117" font-size="11.5" text-anchor="middle" fill="#14151C">Long 110 call</text>
  <text x="32" y="150" font-size="11" fill="#767B8E">Credit $120, max loss $380</text>

  <line x1="210" y1="91" x2="238" y2="91" stroke="#767B8E" stroke-width="1.5"/>
  <path d="M238 91 L231 87 L231 95 Z" fill="#767B8E"/>

  <rect x="244" y="16" width="220" height="150" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="260" y="42" font-size="12.5" font-weight="600" fill="#993C1D">Next morning</text>
  <rect x="260" y="56" width="188" height="30" rx="6" fill="#FBE7EB" stroke="#993C1D"/>
  <text x="354" y="75" font-size="11.5" text-anchor="middle" fill="#14151C">Short 100 shares at 105</text>
  <rect x="260" y="98" width="188" height="30" rx="6" fill="#FFFFFF" stroke="#4B4F60"/>
  <text x="354" y="117" font-size="11.5" text-anchor="middle" fill="#14151C">Long 110 call, still held</text>
  <text x="260" y="150" font-size="11" fill="#767B8E">Above 110 the call caps the loss</text>

  <line x1="468" y1="91" x2="494" y2="91" stroke="#767B8E" stroke-width="1.5"/>
  <path d="M494 91 L487 87 L487 95 Z" fill="#767B8E"/>

  <rect x="500" y="16" width="204" height="70" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="516" y="40" font-size="12.5" font-weight="600" fill="#14151C">Exit A: exercise the call</text>
  <text x="516" y="62" font-size="11.5" font-weight="500" fill="#993C1D">-$380 at any stock price</text>

  <rect x="500" y="96" width="204" height="70" rx="10" fill="#F6F7FB" stroke="#E2E5EE"/>
  <text x="516" y="120" font-size="12.5" font-weight="600" fill="#14151C">Exit B: sell call, buy shares</text>
  <text x="516" y="142" font-size="11.5" font-weight="500" fill="#14151C">-$100 at 108, -$305 at 112</text>

  <text x="24" y="206" font-size="11" fill="#767B8E">Hypothetical figures, mechanics only. Fees, borrow cost and the dividend owed are not included.</text>
</svg>
