<svg viewBox="0 0 720 345" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Four hypothetical $2-wide put credit spreads on one chain, with the short strike moved down. The short put delta falls from 0.48 to 0.34, 0.22 and 0.12. The credit falls from $81 to $54, $31 and $13 while the maximum loss rises from $119 to $146, $169 and $187.">
  <rect width="720" height="345" fill="#FFFFFF"/>
  <text x="158" y="46" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">50/48</text>
  <rect x="170" y="30" width="178.2" height="20" fill="#2E8B5F" fill-opacity="0.85"/>
  <text x="356.2" y="45" font-size="14" font-weight="600" fill="#14151C">$81</text>
  <rect x="170" y="54" width="261.8" height="20" fill="#B4485C" fill-opacity="0.85"/>
  <text x="439.8" y="69" font-size="14" font-weight="600" fill="#14151C">$119</text>
  <text x="158" y="118" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">48/46</text>
  <rect x="170" y="102" width="118.8" height="20" fill="#2E8B5F" fill-opacity="0.85"/>
  <text x="296.8" y="117" font-size="14" font-weight="600" fill="#14151C">$54</text>
  <rect x="170" y="126" width="321.2" height="20" fill="#B4485C" fill-opacity="0.85"/>
  <text x="499.2" y="141" font-size="14" font-weight="600" fill="#14151C">$146</text>
  <text x="158" y="190" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">46/44</text>
  <rect x="170" y="174" width="68.2" height="20" fill="#2E8B5F" fill-opacity="0.85"/>
  <text x="246.2" y="189" font-size="14" font-weight="600" fill="#14151C">$31</text>
  <rect x="170" y="198" width="371.8" height="20" fill="#B4485C" fill-opacity="0.85"/>
  <text x="549.8" y="213" font-size="14" font-weight="600" fill="#14151C">$169</text>
  <text x="158" y="262" font-size="15" font-weight="600" text-anchor="end" fill="#14151C">44/42</text>
  <rect x="170" y="246" width="28.6" height="20" fill="#2E8B5F" fill-opacity="0.85"/>
  <text x="206.6" y="261" font-size="14" font-weight="600" fill="#14151C">$13</text>
  <rect x="170" y="270" width="411.4" height="20" fill="#B4485C" fill-opacity="0.85"/>
  <text x="589.4" y="285" font-size="14" font-weight="600" fill="#14151C">$187</text>
  <rect x="170" y="318" width="12" height="12" fill="#2E8B5F" fill-opacity="0.85"/>
  <text x="188" y="329" font-size="13" fill="#767B8E">credit</text>
  <rect x="250" y="318" width="12" height="12" fill="#B4485C" fill-opacity="0.85"/>
  <text x="268" y="329" font-size="13" fill="#767B8E">max loss</text>
</svg>
