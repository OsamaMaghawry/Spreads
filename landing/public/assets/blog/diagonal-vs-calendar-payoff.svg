<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Gain or loss per share at the near expiration for two hypothetical XYZ spreads on the same 30-day short leg. The calendar, long the 60-day 50 call and short the 30-day 50 call for a 0.94 debit, is a hill that falls back below zero on both sides. The diagonal, long the 60-day 48 call and short the 30-day 52 call for a 2.80 debit, loses more on the downside but stays ahead on the upside.">
  <rect width="720" height="360" fill="#FFFFFF"/>

  <line x1="80" y1="150" x2="660" y2="150" stroke="#C9CEDC" stroke-width="1.5"/>
  <line x1="312" y1="30" x2="312" y2="310" stroke="#E2E5EE" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="312" y="332" font-size="18" font-weight="600" text-anchor="middle" fill="#14151C">50</text>

  <path d="M80 197.6 L109 192.4 L138 184.9 L167 174.8 L196 161.4 L225 144.5 L254 123.6 L283 98.5 L312 69.2 L341 95.8 L370 118.4 L399 137.3 L428 152.8 L457 165.4 L486 175.4 L515 183.3 L544 189.3 L573 194.0 L602 197.4 L631 200.0 L660 201.9" fill="none" stroke="#767B8E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 299.4 L109 289.9 L138 277.2 L167 260.8 L196 240.3 L225 215.5 L254 186.3 L283 152.8 L312 115.2 L341 73.7 L370 28.8 L399 40.8 L428 50.3 L457 57.7 L486 63.2 L515 67.4 L544 70.5 L573 72.8 L602 74.4 L631 75.5 L660 76.3" fill="none" stroke="#14151C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="110" font-size="15" font-weight="600" text-anchor="start" fill="#767B8E">calendar, debit 0.94</text>
  <text x="515" y="33" font-size="15" font-weight="600" text-anchor="middle" fill="#14151C">diagonal 48/52, debit 2.80</text>

  <text x="370" y="354" font-size="15" text-anchor="middle" fill="#767B8E">stock price at near expiration</text>
</svg>
