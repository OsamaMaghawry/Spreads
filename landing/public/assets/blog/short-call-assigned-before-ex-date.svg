<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Three hypothetical accounts, each short a 50 call that is assigned the evening before a 0.50 dividend goes ex. The covered call account has its 100 shares taken at 50 and does not receive the 50 dollar dividend. The call credit spread account is short 100 shares with a long 55 call still open and owes 50 dollars. The uncovered short call account is short 100 shares with nothing behind them and also owes 50 dollars.">
  <rect width="720" height="300" fill="#FFFFFF"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#14151C">Short 50 call assigned the evening before a 0.50 dividend goes ex</text>

  <rect x="24" y="52" width="220" height="40" rx="6" fill="#14151C"/>
  <text x="134" y="77" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Covered call</text>
  <rect x="250" y="52" width="220" height="40" rx="6" fill="#14151C"/>
  <text x="360" y="77" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Call credit spread</text>
  <rect x="476" y="52" width="220" height="40" rx="6" fill="#14151C"/>
  <text x="586" y="77" font-size="15" font-weight="600" text-anchor="middle" fill="#FFFFFF">Uncovered short call</text>

  <text x="24" y="124" font-size="12" fill="#767B8E">The morning after</text>
  <rect x="24" y="132" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#C9CEDC" stroke-width="1.5"/>
  <text x="134" y="159" font-size="14" text-anchor="middle" fill="#14151C">100 shares sold at 50</text>
  <text x="134" y="179" font-size="14" text-anchor="middle" fill="#14151C">$5,000 cash in</text>
  <rect x="250" y="132" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#C9CEDC" stroke-width="1.5"/>
  <text x="360" y="159" font-size="14" text-anchor="middle" fill="#14151C">Short 100 shares at 50</text>
  <text x="360" y="179" font-size="14" text-anchor="middle" fill="#14151C">Long 55 call still open</text>
  <rect x="476" y="132" width="220" height="64" rx="6" fill="#FFFFFF" stroke="#C9CEDC" stroke-width="1.5"/>
  <text x="586" y="159" font-size="14" text-anchor="middle" fill="#14151C">Short 100 shares at 50</text>
  <text x="586" y="179" font-size="14" text-anchor="middle" fill="#14151C">Nothing behind them</text>

  <text x="24" y="226" font-size="12" fill="#767B8E">On the ex-dividend date</text>
  <rect x="24" y="234" width="220" height="40" rx="6" fill="#FBE7EB"/>
  <text x="134" y="259" font-size="14" font-weight="600" text-anchor="middle" fill="#B4485C">Forgoes the $50</text>
  <rect x="250" y="234" width="220" height="40" rx="6" fill="#FBE7EB"/>
  <text x="360" y="259" font-size="14" font-weight="600" text-anchor="middle" fill="#B4485C">Owes $50</text>
  <rect x="476" y="234" width="220" height="40" rx="6" fill="#FBE7EB"/>
  <text x="586" y="259" font-size="14" font-weight="600" text-anchor="middle" fill="#B4485C">Owes $50</text>
</svg>
