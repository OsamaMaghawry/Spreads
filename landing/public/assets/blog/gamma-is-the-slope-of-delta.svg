<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="The delta of one hypothetical 50-strike call plotted against the price of the stock, with 30 days left. The curve runs from near zero at 40 dollars, through about 0.52 where the stock sits at the 50 strike, up toward 0.95 at 60 dollars. A short straight line laid along the curve at 44 dollars is noticeably flatter, so a one dollar move in the stock changes delta less there. A second straight line laid along the curve at the 50 strike is about half again as steep, so the same one dollar move changes delta more. Gamma is the steepness of the curve at a point, and it is largest where the stock sits at the strike.">
  <rect width="720" height="320" fill="#FFFFFF"/>

  <text x="90" y="42" font-size="15" fill="#767B8E">delta</text>

  <line x1="375" y1="58" x2="375" y2="280" stroke="#E2E5EE" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="90" y1="280" x2="665" y2="280" stroke="#E2E5EE" stroke-width="1"/>

