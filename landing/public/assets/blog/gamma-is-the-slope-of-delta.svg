  <text x="132" y="212" font-size="15" font-weight="600" fill="#2E8B5F">smaller gamma</text>

  <path d="M312.3 198.6 L 437.7 131.4" fill="none" stroke="#2E8B5F" stroke-width="3" stroke-linecap="round"/>
  <circle cx="375.0" cy="165.0" r="4" fill="#FFFFFF" stroke="#2E8B5F" stroke-width="2"/>
  <text x="268" y="106" font-size="15" font-weight="600" fill="#2E8B5F">larger gamma</text>

