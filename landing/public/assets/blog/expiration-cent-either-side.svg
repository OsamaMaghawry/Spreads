<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="A closing-price line for a hypothetical 50-strike put at expiration, running from 49.98 on the left to 50.02 on the right. Everything below 50.00 is shaded red and marked exercised: a close at 49.99 leaves the put in the money by one cent, so it is exercised automatically unless the holder instructs otherwise. Everything above 50.00 is shaded green and marked expires: a close at 50.01 leaves it out of the money by one cent. The strike itself, 50.00, is marked pin, the close where the result is decided by the holder rather than by the automatic rule.">
  <rect width="720" height="260" fill="#FFFFFF"/>

  <!-- zones -->
  <rect x="60" y="96" width="300" height="56" fill="#F7DEE2"/>
  <rect x="360" y="96" width="300" height="56" fill="#DDEFE5"/>
  <text x="210" y="80" font-size="18" font-weight="600" text-anchor="middle" fill="#B4485C">exercised</text>
  <text x="510" y="80" font-size="18" font-weight="600" text-anchor="middle" fill="#2E8B5F">expires</text>

  <!-- axis -->
  <line x1="60" y1="152" x2="660" y2="152" stroke="#14151C" stroke-width="2"/>

  <!-- ticks -->
  <line x1="210" y1="146" x2="210" y2="158" stroke="#14151C" stroke-width="2"/>
  <line x1="510" y1="146" x2="510" y2="158" stroke="#14151C" stroke-width="2"/>
  <text x="210" y="184" font-size="16" text-anchor="middle" fill="#14151C">49.99</text>
  <text x="510" y="184" font-size="16" text-anchor="middle" fill="#14151C">50.01</text>

  <!-- strike -->
  <line x1="360" y1="88" x2="360" y2="160" stroke="#14151C" stroke-width="3"/>
  <text x="360" y="184" font-size="16" font-weight="600" text-anchor="middle" fill="#14151C">50.00</text>
  <text x="360" y="212" font-size="15" text-anchor="middle" fill="#767B8E">pin</text>

  <text x="60" y="240" font-size="14" fill="#767B8E">stock closing price</text>
</svg>
