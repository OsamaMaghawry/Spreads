<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The lowercase Greek delta, the same outline the app header draws, set on
       a filled brand tile.

       A TILE RATHER THAN A TRANSPARENT MARK, because a tab strip is the one
       place the background is not ours: Chrome's is near-white in light mode
       and near-black in dark, and a single-colour letter has to survive both.
       A violet ground with a white letter reads the same on either, which a
       violet letter on transparent does not.

       This and the app mark used to disagree: the mark was violet #534AB7 and
       mint #3FA672 while the icon was ink #14151C and mint #2E8B5F, so the
       product and its own tab icon were different colours. One pair now. -->
  <rect width="32" height="32" rx="7" fill="#534AB7"/>
