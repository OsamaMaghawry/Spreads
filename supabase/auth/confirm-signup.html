<!-- Confirm signup.
     The app's registration screen asks for a six-digit code and calls
     verifyOtp, so this template must emit {{ .Token }}. Supabase's stock
     template carries only {{ .ConfirmationURL }}, which is why a code box sat
     waiting for a code that was never in the email.
     Both are offered: the code for the person who is still on the tab they
     signed up in, the link for the person who is not. -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#0f172a">
  <p style="font-size:18px;font-weight:600;margin:0 0 16px">Confirm your email</p>
  <p style="font-size:14px;line-height:1.6;margin:0 0 24px;color:#475569">
    Enter this code in DeltaMint to finish setting up your account:
  </p>
  <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:0 0 24px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">
    {{ .Token }}
  </p>
  <p style="font-size:14px;line-height:1.6;margin:0 0 24px;color:#475569">
    The code expires in one hour. If you have closed the tab, you can
    <a href="{{ .ConfirmationURL }}" style="color:#4f46e5">confirm here instead</a>.
  </p>
  <p style="font-size:12px;line-height:1.6;margin:0;color:#94a3b8">
    If you did not create a DeltaMint account, ignore this email and nothing will happen.
  </p>
</div>
