# Per-function deploy settings.
#
# Everything not named here keeps the CLI defaults, which includes
# verify_jwt = true. Only exceptions belong in this file, and each one needs a
# reason, because switching the gateway's JWT check off moves that check into
# the function where it is easy to forget.

project_id = "yecfbeohyakuoyczvdbj"

[functions.marketStream]
# A browser cannot set an Authorization header when opening a WebSocket, so the
# gateway would reject every connection before the function ran. The caller's
# token travels in the query string instead and the function verifies it itself
# — see userFromQuery — and then re-checks that the account belongs to that user
# before decrypting anything. Turning this off without those two checks would
# expose one account's prices to any caller.
verify_jwt = false

[functions.stripeWebhook]
# Stripe holds no Supabase token, so the gateway's JWT check would refuse
# every delivery. The function authenticates each request itself with the
# signature Stripe puts on it (STRIPE_WEBHOOK_SECRET) before reading the body,
# and it is the only writer of the subscriptions table.
verify_jwt = false

[functions.mcp]
# The Claude connector. An MCP client finds where to sign in from the 401 it
# gets on its first request: the response must carry a WWW-Authenticate header
# pointing at this function's OAuth metadata. The gateway's own 401 carries no
# such pointer, so with the check on, Claude could never discover the sign-in
# and the connector could not be added at all. The function verifies the
# bearer token itself on every request (userFor, via Supabase Auth) before
# doing anything, and its tools only read. It also refuses to run outside the
# staging project until it is released on purpose.
verify_jwt = false
